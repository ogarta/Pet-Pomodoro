<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hướng 3 · Cozy Handheld Console — Pet Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --ink: #2B3A18;
    --ink2: #42591F;
    --lcd: #C7D5A0;
    --red: #C13E31;
    --red-d: #8E271E;
    --amber: #B3672B;
    --rose: #B04A6B;
    --leaf: #4E7A28;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    background:
      repeating-linear-gradient(0deg, rgba(122,100,62,.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(90deg, rgba(122,100,62,.05) 0 2px, transparent 2px 26px),
      #E9DCC3;
    color: #4A3F2C;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .pixelfont { font-family: 'VT323', monospace; }
  .psp { font-family: 'Press Start 2P', monospace; }

  /* ---------- demo page ---------- */
  .page { padding: 44px 48px 64px; }
  .page-head { margin-bottom: 32px; border-bottom: 3px solid rgba(122,100,62,.25); padding-bottom: 20px; }
  .page-head h1 { font-size: 27px; font-weight: 800; color: #574726; letter-spacing: .2px; }
  .page-head p { font-size: 15.5px; color: #6D5D40; margin-top: 8px; max-width: 1150px; line-height: 1.55; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .demo-item { display: flex; flex-direction: column; align-items: center; }
  .demo-label { font-style: italic; font-size: 15px; color: #6D5D40; margin-bottom: 10px; font-weight: 600; }

  /* ---------- console shell ---------- */
  .pshell {
    height: 100%;
    display: flex; flex-direction: column;
    padding: 34px 0 26px;
    border-top: 4px solid rgba(255,255,255,.55);
    border-bottom: 4px solid rgba(122,100,62,.18);
    box-shadow: inset 0 0 0 2px rgba(122,100,62,.16);
  }
  .shell-top { display: flex; align-items: center; justify-content: space-between; padding: 2px 20px 8px; }
  .pwr { display: flex; align-items: center; gap: 5px; }
  .led { width: 9px; height: 9px; border-radius: 50%; background: #E0492E; box-shadow: 0 0 6px rgba(224,73,46,.85); }
  .pwr .psp { font-size: 12px; color: #6E5F45; }
  .wordmark { font-size: 12px; color: #574726; letter-spacing: 1px; }
  .model { font-size: 12.5px; font-weight: 800; color: #6E5F45; letter-spacing: 1.5px; }

  .bezel {
    flex: 1; margin: 0 14px;
    background: #4E483C; border: 3px solid #37322A;
    border-radius: 16px 16px 22px 22px;
    padding: 11px 11px 5px;
    display: flex; flex-direction: column;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 3px 0 rgba(122,100,62,.25);
  }
  .bezel-cap { text-align: center; color: #CFC7B4; font-size: 14px; letter-spacing: 1px; padding: 3px 0 2px; }
  .lcd-main { flex: 1; }

  .lcdp {
    position: relative; background: var(--lcd);
    border: 2px solid #55642F; border-radius: 10px; overflow: hidden;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -3px 0 rgba(43,58,24,.15);
  }
  .lcd-grid {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background:
      repeating-linear-gradient(0deg, rgba(43,58,24,.05) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(43,58,24,.045) 0 1px, transparent 1px 3px);
  }
  .lcd-glare {
    position: absolute; top: -40%; left: -18%; width: 46%; height: 190%;
    background: linear-gradient(100deg, rgba(255,255,246,.13), rgba(255,255,246,0) 70%);
    transform: rotate(8deg); pointer-events: none; z-index: 31;
  }
  .lcd-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; padding: 12px 12px 10px; overflow: hidden; }

  /* ---------- screens ---------- */
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .scr-title { font-family: 'VT323', monospace; font-size: 25px; color: var(--ink); text-align: center; line-height: 1.05; }
  .scr-sub { text-align: center; font-size: 13px; color: var(--ink2); font-weight: 600; margin-top: 2px; }

  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .status-chip {
    font-size: 12.5px; font-weight: 800; letter-spacing: .8px;
    padding: 3px 9px; border: 2px solid var(--ink); border-radius: 4px;
    background: rgba(255,255,255,.35); color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .status-chip::before { content: ''; width: 8px; height: 8px; background: currentColor; border-radius: 2px; flex-shrink: 0; }
  .status-chip.go { background: var(--ink); color: #DFE9C0; }
  .status-chip.warn { border-color: #8A5A2C; color: #7C4E22; background: rgba(255,255,255,.45); }
  .status-chip.rest { border-color: #4E7A28; color: #3E6320; background: rgba(255,255,255,.45); }
  .status-chip.idle { color: var(--ink2); }
  .session { font-size: 19px; color: var(--ink2); letter-spacing: 1px; }

  .timer-wrap { position: relative; text-align: center; line-height: .82; margin: 4px 0 2px; }
  .timer { font-size: 84px; color: var(--ink); position: relative; z-index: 2; }
  .timer-ghost { position: absolute; left: 0; right: 0; top: 0; font-size: 84px; color: rgba(43,58,24,.08); z-index: 1; }
  .timer-wrap.sm .timer, .timer-wrap.sm .timer-ghost { font-size: 54px; }

  .stage {
    position: relative; height: 126px; margin: 4px 6px 8px;
    background: rgba(255,255,255,.14);
    border: 2px solid rgba(43,58,24,.35); border-radius: 8px; overflow: hidden;
  }
  .stage.night { background: rgba(43,58,24,.10); }
  .pet { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); }
  .pet.hop { animation: hop .5s steps(1, end) infinite alternate; }
  @keyframes hop { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-9px); } }
  .ground { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 3px; background: rgba(43,58,24,.4); border-radius: 2px; }
  .grass { position: absolute; bottom: 8px; }
  .zzz { position: absolute; font-family: 'VT323', monospace; color: var(--ink2); animation: zfloat 2.6s steps(6, end) infinite; z-index: 5; }
  .z1 { top: 34%; right: 24%; font-size: 18px; }
  .z2 { top: 24%; right: 33%; font-size: 24px; animation-delay: .8s; }
  .z3 { top: 14%; right: 20%; font-size: 30px; animation-delay: 1.6s; }
  @keyframes zfloat { 0% { opacity: 0; transform: translate(0, 6px); } 25% { opacity: .95; } 100% { opacity: 0; transform: translate(12px, -26px); } }

  .talk-box { background: rgba(255,255,255,.4); border: 2px solid var(--ink); border-radius: 8px; padding: 7px 10px; text-align: center; }
  .talk-box b { font-size: 15.5px; color: var(--ink); }
  .tip-line { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; color: var(--ink2); font-weight: 700; margin-top: 3px; }
  .tip-bang { font-family: 'VT323', monospace; background: #E8B54B; color: #4A3608; border-radius: 3px; padding: 0 6px; font-size: 17px; line-height: 1.1; }

  .xp-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
  .lv-chip { background: var(--ink); color: #E4EDC2; font-size: 17px; padding: 1px 8px; border-radius: 4px; letter-spacing: 1px; }
  .xp-bar { flex: 1; height: 12px; display: flex; gap: 3px; padding: 2px; border: 2px solid rgba(43,58,24,.55); border-radius: 4px; }
  .xp-bar i { flex: 1; background: rgba(43,58,24,.13); border-radius: 1px; }
  .xp-bar i.on { background: var(--leaf); }
  .xp-num { font-size: 17px; color: var(--ink2); letter-spacing: .5px; }

  .meters { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
  .mini-label { font-size: 12.5px; font-weight: 800; letter-spacing: .4px; color: var(--ink2); }

  .foot-row { margin-top: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .lcdbtn {
    cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 13.5px; letter-spacing: .3px;
    color: var(--ink); background: rgba(255,255,255,.35);
    border: 2px solid var(--ink); border-radius: 8px; padding: 8px 12px;
    box-shadow: 3px 3px 0 rgba(43,58,24,.85);
    transition: transform .06s, box-shadow .06s, background .12s;
  }
  .lcdbtn:hover { background: rgba(255,255,255,.62); }
  .lcdbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(43,58,24,.85); }
  .lcdbtn.primary { background: var(--ink); color: #DFE9C0; }
  .lcdbtn.primary:hover { background: #3A4D20; }
  .lcdbtn.big { width: 100%; padding: 11px 12px; font-size: 15px; }
  .lcdbtn:disabled { opacity: .55; cursor: not-allowed; }

  /* egg screen */
  .egg-card {
    cursor: pointer; display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; background: rgba(255,255,255,.28);
    border: 2px solid rgba(43,58,24,.4); border-radius: 10px; position: relative;
    transition: background .12s, transform .06s;
    box-shadow: 2px 2px 0 rgba(43,58,24,.25);
  }
  .egg-card:hover { background: rgba(255,255,255,.5); }
  .egg-card:active { transform: translate(1px, 1px); }
  .egg-card.sel { border: 3px solid var(--ink); background: rgba(255,255,255,.55); box-shadow: 3px 3px 0 rgba(43,58,24,.55); }
  .egg-slot {
    width: 62px; height: 58px; display: flex; align-items: center; justify-content: center;
    background: rgba(43,58,24,.08); border-radius: 8px;
    border: 2px dashed rgba(43,58,24,.3); flex-shrink: 0;
  }
  .egg-slot.sel { border-style: solid; border-color: var(--ink); background: rgba(255,255,255,.5); }
  .egg-name { font-size: 16.5px; font-weight: 800; color: var(--ink); text-align: left; }
  .egg-sub { font-size: 12.5px; color: var(--ink2); font-weight: 600; text-align: left; margin-top: 1px; }
  .chip-sel {
    position: absolute; top: -9px; right: 10px;
    background: var(--amber); color: #FFF6E4;
    font-size: 12px; font-weight: 800; letter-spacing: .5px;
    padding: 1px 7px; border-radius: 4px; border: 2px solid rgba(43,58,24,.5);
  }
  .blink-tri {
    position: absolute; right: 12px; top: 50%; margin-top: -6px;
    width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    border-left: 9px solid var(--ink);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  .adopted-box {
    background: rgba(255,255,255,.5); border: 2px dashed var(--ink); border-radius: 10px;
    padding: 10px; text-align: center; display: flex; flex-direction: column; gap: 8px;
    font-size: 14px; color: var(--ink); font-weight: 600;
  }

  /* feed screen */
  .happy-banner {
    margin: 6px auto 2px; text-align: center;
    font-family: 'VT323', monospace; font-size: 21px; color: var(--ink);
    background: rgba(255,255,255,.45); border: 2px solid var(--ink); border-radius: 6px;
    padding: 2px 12px; width: fit-content;
    animation: pop .25s steps(3);
  }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .feed-row { display: flex; align-items: stretch; gap: 10px; margin-top: 4px; }
  .sushi-plate { background: rgba(255,255,255,.35); border: 2px solid rgba(43,58,24,.4); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; }
  .hint-line { font-size: 12.5px; color: var(--ink2); font-weight: 600; margin-top: 9px; line-height: 1.4; }
  .heart { position: absolute; animation: heartup 1.4s steps(5) forwards; }
  @keyframes heartup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-32px); } }

  /* stats screen */
  .fire-row { display: flex; gap: 6px; margin: 10px 0; }
  .day-cell {
    flex: 1; background: rgba(255,255,255,.25); border: 2px solid rgba(43,58,24,.35);
    border-radius: 8px; padding: 6px 2px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .day-cell span { font-size: 12.5px; font-weight: 800; color: var(--ink2); }
  .day-cell.today { border-color: var(--ink); background: rgba(255,255,255,.55); }
  .fire.today { animation: firehop .6s steps(1) infinite alternate; }
  @keyframes firehop { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .fire-row.big .day-cell { padding: 10px 2px 8px; }

  .today-panel {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.3); border: 2px solid rgba(43,58,24,.4);
    border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
  }
  .big-num { font-size: 44px; color: var(--ink); line-height: .8; }
  .v-sep { width: 2px; height: 40px; background: rgba(43,58,24,.25); border-radius: 2px; }
  .goal { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .goal-bar { width: 110px; height: 12px; display: flex; gap: 3px; }
  .goal-bar i { flex: 1; background: rgba(43,58,24,.14); border-radius: 2px; }
  .goal-bar i.on { background: var(--amber); }

  .hist { background: rgba(255,255,255,.28); border: 2px solid rgba(43,58,24,.4); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 13.5px; color: var(--ink); padding-bottom: 5px; border-bottom: 2px solid rgba(43,58,24,.2); }
  .hist-head .pixelfont { font-size: 17px; color: var(--ink2); }
  .hist-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(43,58,24,.12); }
  .hist-row:last-child { border-bottom: none; }
  .dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .dot.ok { background: var(--leaf); }
  .dot.skip { background: #E8B54B; }
  .hist-row .time { font-size: 19px; color: var(--ink); min-width: 52px; }
  .hist-row .mini-label { flex: 1; }
  .hist-row .xp { font-size: 17px; color: var(--leaf); }
  .hist-row.muted { opacity: .55; }
  .hist-day-label { font-size: 12.5px; font-weight: 800; color: var(--ink2); letter-spacing: 1px; padding-top: 7px; }

  .sync-card { background: rgba(255,255,255,.42); border: 2px solid var(--ink); border-radius: 12px; padding: 10px; box-shadow: 3px 3px 0 rgba(43,58,24,.4); }
  .sync-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: #F6E7C9; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .avatar.sm { width: 38px; height: 38px; }
  .sync-name { font-size: 16px; font-weight: 800; color: var(--ink); }
  .g-btn {
    cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px;
    background: #FFFFFF; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14.5px; color: #3C3C3C;
    box-shadow: 3px 3px 0 rgba(43,58,24,.5);
    transition: transform .06s, box-shadow .06s, filter .15s;
  }
  .g-btn:hover { filter: brightness(.97); }
  .g-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(43,58,24,.5); }

  /* tab bar */
  .lcd-tab {
    cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 2px 4px; background: rgba(255,255,255,.28); color: var(--ink);
    border: 2px solid rgba(43,58,24,.45); border-radius: 8px;
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 12.5px;
    transition: background .12s;
  }
  .lcd-tab:hover { background: rgba(255,255,255,.55); }
  .lcd-tab:active { transform: translateY(1px); }
  .lcd-tab.active { background: var(--ink); color: #DFE9C0; border-color: var(--ink); }
  .lcd-tab.active::after { content: ''; width: 14px; height: 3px; background: #DFE9C0; animation: blink 1s steps(1) infinite; }

  /* deck */
  .deck { display: flex; align-items: center; gap: 12px; padding: 12px 18px 2px; }
  .deck-mid { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pills { display: flex; gap: 16px; }
  .pill-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pill { width: 44px; height: 13px; border-radius: 999px; background: #E7D9BB; border: 2px solid #C6B48D; box-shadow: 0 2px 0 #C6B48D; transform: rotate(-18deg); cursor: pointer; }
  .pill:active { transform: rotate(-18deg) translateY(2px); box-shadow: none; }
  .shell-label { font-size: 12px; font-weight: 800; letter-spacing: .8px; color: #6E5F45; }
  .speaker { display: flex; gap: 7px; }
  .speaker i { width: 6px; height: 18px; border-radius: 3px; background: rgba(122,100,62,.28); box-shadow: inset 0 2px 2px rgba(122,100,62,.4); transform: skewX(-14deg); }
  .deck-hint { font-size: 12px; font-weight: 700; color: #6E5F45; text-align: center; line-height: 1.35; }
  .deck-right { display: flex; gap: 14px; }
  .ab-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ab-btn {
    width: 54px; height: 54px; border-radius: 50%;
    border: 3px solid var(--red-d); background: var(--red);
    box-shadow: 0 5px 0 var(--red-d), inset 0 -5px 0 rgba(0,0,0,.2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform .05s, box-shadow .05s, filter .12s;
  }
  .ab-btn:hover { filter: brightness(1.07); }
  .ab-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-d), inset 0 -2px 0 rgba(0,0,0,.2); }
  .ab-btn .psp { font-size: 14px; color: #FFF6E8; }
  .ab-btn.dark { background: #A93529; }

  .dp-arm {
    position: absolute; cursor: pointer; background: #E7D9BB; border: 2px solid #C6B48D;
    box-shadow: inset 0 -3px 0 rgba(120,100,60,.28), 0 2px 0 #C6B48D;
    transition: transform .05s, box-shadow .05s, background .12s;
  }
  .dp-arm:hover { background: #EFE2C6; }
  .dp-arm:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(120,100,60,.28); }
  .dp-dec { position: absolute; background: #E7D9BB; border: 2px solid #C6B48D; box-shadow: inset 0 -3px 0 rgba(120,100,60,.28); }
  .dp-tri { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .dp-tri-l { transform: translate(-50%, -50%); border-right: 7px solid #A08A5C; border-left: none; }
  .dp-tri-r { transform: translate(-50%, -50%); border-left: 7px solid #A08A5C; border-right: none; }

  /* ---------- desktop web ---------- */
  .web-app { height: 100%; display: flex; flex-direction: column; background: #F1E8D5; }
  .web-bar { display: flex; align-items: center; gap: 26px; padding: 14px 26px; background: #F6EFDF; border-bottom: 3px solid rgba(122,100,62,.28); box-shadow: 0 3px 0 rgba(122,100,62,.12); }
  .web-mark { font-size: 13px; color: #574726; }
  .web-nav { display: flex; gap: 8px; flex: 1; }
  .wnav { cursor: pointer; font-weight: 800; font-size: 14px; color: #6E5F45; padding: 6px 14px; border-radius: 999px; border: 2px solid transparent; }
  .wnav:hover { border-color: rgba(122,100,62,.4); }
  .wnav.active { background: #574726; color: #F3EBD8; border-color: #574726; box-shadow: 2px 2px 0 rgba(87,71,38,.35); }
  .web-right { display: flex; align-items: center; gap: 12px; }
  .web-main { flex: 1; display: flex; gap: 18px; padding: 18px 26px; min-height: 0; }
  .web-left { flex: 1.35; min-width: 0; display: flex; }
  .lcd-web { flex: 1; }
  .w-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; padding: 18px 20px; }
  .web-right-col { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .plastic-card { background: #F6EFDF; border: 2px solid #C9B892; border-radius: 16px; box-shadow: 4px 4px 0 rgba(122,100,62,.22), inset 0 2px 0 rgba(255,255,255,.7); padding: 12px; }
  .mc-head { text-align: center; }
  .lcd-mini { margin-top: 8px; }

/* ---------- pixel sprite renderer ---------- */
function PixelSprite({ rows, pal, px = 4, style }) {
  const h = rows.length;
  const w = rows[0].length;
  const rects = [];
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const c = pal[row[x]];
      if (c) rects.push(<rect key={x + '_' + y} x={x} y={y} width={1.04} height={1.04} fill={c} />);
    }
  });
  return (
    <svg width={w * px} height={h * px} viewBox={'0 0 ' + w + ' ' + h} shapeRendering="crispEdges" style={{ display: 'block', ...style }}>
      {rects}
    </svg>
  );
}

    <div style={{ position: 'relative', width: 96, height: 96, flexShrink: 0 }}>
      <div className="dp-dec" style={decStyle} />
      <div className="dp-dec" style={{ left: 34, bottom: 0, width: 28, height: 37, borderRadius: '2px 2px 7px 7px' }} />
      <div className="dp-dec" style={{ left: 34, top: 34, width: 28, height: 28 }} />
      <button className="dp-arm" style={{ left: 0, top: 34, width: 37, height: 28, borderRadius: '2px 7px 7px 2px' }} onClick={onPrev} aria-label="Màn trước">
        <span className="dp-tri dp-tri-l" />
      </button>
      <button className="dp-arm" style={{ right: 0, top: 34, width: 37, height: 28, borderRadius: '7px 2px 2px 7px' }} onClick={onNext} aria-label="Màn sau">
        <span className="dp-tri dp-tri-r" />
      </button>
      <div style={{ position: 'absolute', left: 42, top: 42, width: 12, height: 12, borderRadius: '50%', background: 'rgba(120,100,60,.22)' }} />
    </div>
  );
}

function RoundBtn({ letter, label, onClick, dark }) {
  return (
    <div className="ab-col">
      <button className={'ab-btn' + (dark ? ' dark' : '')} onClick={onClick} aria-label={label}>
        <span className="psp">{letter}</span>
      </button>
      <span className="shell-label">{label}</span>
    </div>
  );
}

/* ---------- screens ---------- */
function EggScreen({ s, setS }) {
  return (
    <div className="screen">
      <div className="scr-title">Chọn quả trứng của bạn</div>
      <div className="scr-sub">Bé sẽ nở sau phiên tập đầu tiên</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 9, marginTop: 12 }}>
        {Object.keys(SPECIES).map(id => {
          const sp = SPECIES[id];
          const sel = s.egg === id;
          return (
            <button key={id} className={'egg-card' + (sel ? ' sel' : '')} onClick={() => setS({ ...s, egg: id, adopted: false })}>
              <div className={'egg-slot' + (sel ? ' sel' : '')}>
                <PixelSprite rows={EGG_ROWS} pal={sp.eggPal} px={3.4} />
              </div>
              <div style={{ flex: 1 }}>
                <div className="egg-name">{sp.name}</div>
                <div className="egg-sub">{sp.sub}</div>
              </div>
              {sel && <span className="blink-tri" />}
              {sel && <span className="chip-sel">ĐANG CHỌN</span>}
            </button>
          );
        })}
      </div>
      <div style={{ marginTop: 'auto', paddingTop: 12 }}>
        {!s.adopted ? (
          <button className="lcdbtn primary big" onClick={() => setS({ ...s, adopted: true })}>
            Nhận bé về nhà
          </button>
        ) : (
          <div className="adopted-box">
            <span>Đã đón <b>{SPECIES[s.egg].name}</b> về nhà! Bé sống bằng sự tập trung của bạn.</span>
            <button className="lcdbtn" onClick={() => setS({ ...s, tab: 'focus', focusState: 'fresh', mode: 'focus' })}>
              Bắt đầu tập thôi
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function FocusScreen({ s, setS }) {
  const pet = SPECIES[s.egg];
  const paused = s.focusState === 'pause';
  const fresh = s.focusState === 'fresh';
  const breakM = s.mode === 'break';
  const timer = breakM ? '04:12' : fresh ? '25:00' : '24:31';
  const status = breakM ? 'GIỜ NGHỈ' : fresh ? 'SẴN SÀNG' : paused ? 'TẠM DỪNG' : 'ĐANG TẬP TRUNG';
  const chipCls = breakM ? 'rest' : (paused || fresh) ? (fresh ? 'idle' : 'warn') : 'go';
  const xpCells = [];
  for (let i = 0; i < 10; i++) xpCells.push(<i key={i} className={i < 6 ? 'on' : ''} />);

  return (
    <div className="screen">
      <div className="status-row">
        <span className={'status-chip ' + chipCls}>{status}</span>
        <span className="pixelfont session">Phiên {s.session}/4</span>
      </div>
      <div className="timer-wrap">
        <span className="pixelfont timer-ghost">88:88</span>
        <span className="pixelfont timer">{timer}</span>
      </div>
      <PetStage
        species={s.egg}
        mood={breakM ? 'sleep' : 'idle'}
        hop={s.mode === 'focus' && !fresh}
        paused={paused}
        zzz={breakM}
      />
      {breakM ? (
        <div className="talk-box">
          <b>Bé {pet.name} đang ngủ…</b>
          <div className="tip-line"><span className="tip-bang">!</span> Đứng lên vươn vai nào!</div>
        </div>
      ) : (
        <div className="xp-row">
          <span className="pixelfont lv-chip">LV.4</span>
          <div className="xp-bar">{xpCells}</div>
          <span className="pixelfont xp-num">120/200 XP</span>
        </div>
      )}
      <div className="meters">
        <BlockMeter label="Đói" pct={s.hunger} fill="#B3672B" />
        <BlockMeter label="Vui" pct={s.joy} fill="#B04A6B" />
      </div>
      <div className="foot-row">
        <CoinChip coin={s.coin} />
        <div style={{ display: 'flex', gap: 8, marginLeft: 'auto' }}>
          {breakM ? (
            <button className="lcdbtn primary" onClick={() => setS({ ...s, mode: 'focus', focusState: 'fresh', session: s.session + 1 })}>
              Bỏ qua nghỉ
            </button>
          ) : fresh ? (
            <button className="lcdbtn primary" onClick={() => setS({ ...s, focusState: 'run' })}>
              Bắt đầu phiên {s.session}
            </button>
          ) : (
            <React.Fragment>
              <button className="lcdbtn primary" onClick={() => setS({ ...s, focusState: paused ? 'run' : 'pause' })}>
                {paused ? 'Tiếp tục' : 'Tạm dừng'}
              </button>
              <button className="lcdbtn" onClick={() => setS({ ...s, focusState: 'fresh' })}>
                Bỏ phiên
              </button>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

function FeedScreen({ s, setS, feed }) {

  return (
    <div className="screen">
      <div className="status-row">

}

        </div>
        <div style={{ flex: 1 }} />

      <div className="sync-card">

          </div>
          <div>
            <div className="sync-name">Minh Anh</div>
            <div className="mini-label">Đã đồng bộ · web <ArrowSwap /> Android · 2 phút trước</div>
          </div>
        </div>
        <button className="g-btn">
          <GoogleG /> Đăng nhập bằng Google
        </button>
      </div>
    </div>
  );
}

/* ---------- phone app: state machine ---------- */
function PhoneApp({ tint, initial }) {
  const [s, setS] = useState(initial);
  const pet = SPECIES[s.egg];

  const goTab = id => setS({ ...s, tab: id, justFed: id === 'feed' ? s.justFed : false });
  const cycleTab = dir => {
    const idx = TAB_DEFS.findIndex(t => t.id === s.tab);
    const next = TAB_DEFS[(idx + dir + TAB_DEFS.length) % TAB_DEFS.length].id;
    goTab(next);
  };
  const feed = () => {
    if (s.coin > 0) setS({ ...s, coin: s.coin - 1, hunger: Math.min(100, s.hunger + 40), joy: Math.min(100, s.joy + 10), justFed: true });
  };
  const feedFromB = () => {
    if (s.coin > 0) setS({ ...s, tab: 'feed', coin: s.coin - 1, hunger: Math.min(100, s.hunger + 40), joy: Math.min(100, s.joy + 10), justFed: true });
  };
  const onA = () => {
    if (s.tab !== 'focus') { setS({ ...s, tab: 'focus' }); return; }
    if (s.mode === 'break') { setS({ ...s, mode: 'focus', focusState: 'fresh', session: s.session + 1 }); return; }
    setS({ ...s, focusState: s.focusState === 'pause' ? 'run' : 'pause' });
  };

  const speaker = [];
  for (let i = 0; i < 6; i++) speaker.push(<i key={i} />);

  return (
    <div className="pshell" style={{ background: tint }}>
      <div className="shell-top">
        <div className="pwr"><span className="led" /><span className="psp">PWR</span></div>
        <div className="wordmark psp">PET POMODORO</div>
        <div className="model">PP-01</div>
      </div>
      <div className="bezel">
        <LcdPanel className="lcd-main">
          <div className="lcd-content">
            {s.tab === 'egg' && <EggScreen s={s} setS={setS} />}
            {s.tab === 'focus' && <FocusScreen s={s} setS={setS} />}
            {s.tab === 'feed' && <FeedScreen s={s} setS={setS} feed={feed} />}
            {s.tab === 'stats' && <StatsScreen s={s} />}
            <TabBar tab={s.tab} onTab={goTab} />
          </div>
        </LcdPanel>
        <div className="pixelfont bezel-cap">DOT-MATRIX · PIN CỦA BÉ = SỰ TẬP TRUNG</div>
      </div>
      <div className="deck">
        <Dpad onPrev={() => cycleTab(-1)} onNext={() => cycleTab(1)} />
        <div className="deck-mid">
          <div className="pills">
            <div className="pill-col"><span className="pill" /><span className="shell-label">SELECT</span></div>
            <div className="pill-col"><span className="pill" /><span className="shell-label">START</span></div>
          </div>
          <div className="speaker">{speaker}</div>
          <div className="deck-hint">◀ ▶ đổi màn hình · A tạm dừng · B cho ăn</div>
        </div>
        <div className="deck-right">
          <RoundBtn letter="B" label="CHO ĂN" onClick={feedFromB} dark />
          <RoundBtn letter="A" label="TẠM DỪNG" onClick={onA} />
        </div>
      </div>
    </div>
  );
}

function ConsolePhone({ tint, label, initial }) {
  return (
    <div className="demo-item">
      <em className="demo-label">{label}</em>
      <AndroidFrame time="20:24" battery={76}>
        <PhoneApp tint={tint} initial={initial} />
      </AndroidFrame>
    </div>
  );
}
