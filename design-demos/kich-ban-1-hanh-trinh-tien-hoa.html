<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kịch bản 1 · Hành trình Tiến hoá — Memphis Maximalism · Pet Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Serif+Display:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --cream:#F2E9D8; --cream2:#E7DCC3; --paper:#FBF5E9; --ink:#26201D;
    --red:#BC3A28;   --red2:#9A2F20;
    --mustard:#E3A72F; --mustard2:#C98F1D; --mustardInk:#8A6210;
    --blue:#2B54A3;  --blue2:#1F3F7E;
    --purple:#6B4C9A; --purple2:#553A7E;
    --olive:#5F6B2F; --olive2:#4C5624;
    --pink:#E89BB0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Space Mono',monospace;}
  button{font:inherit;color:inherit;}
  .f-serif{font-family:'DM Serif Display',serif;}
  .f-bungee{font-family:'Bungee',cursive;}
  .f-mono{font-family:'Space Mono',monospace;}

  /* ---- nút arcade: viền 3px + bóng cứng lệch, hover nhấc lên ---- */
  .rbtn{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:11px 16px;
        font-size:14.5px;font-weight:700;cursor:pointer;letter-spacing:.3px;
        transition:transform .12s,box-shadow .12s,background-color .12s,color .12s;
        background:var(--cream);color:var(--ink);}
  .rbtn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);}
  .rbtn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);}
  .rbtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink);}
  .rbtn-red{background:var(--red);color:var(--paper);}
  .rbtn-red:hover:not(:disabled){background:var(--mustard);color:var(--ink);}
  .rbtn-purple{background:var(--purple);color:var(--paper);}
  .rbtn-purple:hover:not(:disabled){background:var(--mustard);color:var(--ink);}
  .rbtn-olive{background:var(--olive);color:var(--paper);}
  .rbtn-olive:hover:not(:disabled){background:var(--red);color:var(--paper);}
  .rbtn-ghost{background:transparent;color:var(--ink);}
  .rbtn-ghost:hover:not(:disabled){background:var(--ink);color:var(--paper);}
  .gbtn{display:inline-flex;align-items:center;gap:9px;background:#FFFDF6;color:var(--ink);padding:9px 14px;font-size:14px;}
  .gbtn:hover:not(:disabled){background:#FFFFFF;}

  /* ---- thẻ trứng: sticker nghiêng, hover đứng thẳng ---- */
  .eggcard{display:flex;gap:14px;align-items:center;border:3px solid var(--ink);
           box-shadow:4px 4px 0 var(--ink);padding:10px 14px;cursor:pointer;
           transform:rotate(var(--rot,0deg));position:relative;
           transition:transform .15s,box-shadow .15s,background-color .15s;background:var(--paper);}
  .eggcard:hover{transform:rotate(0deg) translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);}
  .eggcard.picked{--rot:0deg;border-color:var(--red);box-shadow:6px 6px 0 var(--red2);background:#FBF0D2 !important;}
  .pickbadge{position:absolute;top:-10px;right:10px;background:var(--red);color:var(--paper);
             font-size:12px;font-weight:700;border:2.5px solid var(--ink);padding:2px 7px;transform:rotate(3deg);}

  /* ---- tab bar trong phone ---- */
  .ptab{flex:1;border:3px solid var(--ink);background:var(--cream2);color:var(--ink);
        padding:9px 2px;font-size:12.5px;font-weight:700;cursor:pointer;
        box-shadow:3px 3px 0 var(--ink);transform:rotate(var(--tr,0deg));
        transition:transform .15s,box-shadow .15s,background-color .15s;
        font-family:'Space Mono',monospace;}
  .ptab:hover{background:var(--mustard);}
  .ptab.on{transform:translateY(-5px) rotate(0deg);box-shadow:4px 6px 0 var(--ink);}

  /* ---- animation ---- */
  @keyframes petBounce{
    0%,100%{transform:translateY(0);}
    28%{transform:translateY(-13px);}
    44%{transform:translateY(0) scaleY(.97);}
    60%{transform:translateY(-6px);}
    74%{transform:translateY(0);}
  }
  .pet-bounce{animation:petBounce 1.7s ease-in-out infinite;}
  /* §2.4 ốm yếu: shiver rung ±1px, ~400ms/lần (steps → giật pixel, không lượn) */
  @keyframes petShiver{
    0%,100%{transform:translate(0,0);}
    25%{transform:translate(-1px,1px);}
    50%{transform:translate(1px,0);}
    75%{transform:translate(-1px,-1px);}
  }
  .pet-sick{animation:petShiver .4s steps(1,end) infinite;}
  /* §2.4: 2 giọt mồ hôi darkest bay quanh đầu + bubble "…" nhấp nhô */
  @keyframes sweatFly{
    0%{opacity:0;transform:translate(0,6px) scale(.5);}
    25%{opacity:1;}
    70%{opacity:1;transform:translate(-9px,-14px) scale(1);}
    100%{opacity:0;transform:translate(-15px,-26px) scale(.75);}
  }
  @keyframes sweatFlyR{
    0%{opacity:0;transform:translate(0,6px) scale(.5);}
    25%{opacity:1;}
    70%{opacity:1;transform:translate(9px,-14px) scale(1);}
    100%{opacity:0;transform:translate(15px,-26px) scale(.75);}
  }
  .sick-sweat{position:absolute;width:8px;height:11px;background:#26201D;border-radius:50% 50% 50% 50%/62% 62% 40% 40%;animation:sweatFly 1.5s ease-in infinite;z-index:5;}
  .sick-sweat.r{animation-name:sweatFlyR;}
  @keyframes bubbleBob{
    0%,100%{transform:translateY(0) rotate(6deg);}
    50%{transform:translateY(-4px) rotate(6deg);}
  }
  .sick-bubble{position:absolute;animation:bubbleBob 2.4s ease-in-out infinite;z-index:6;}
  @keyframes evoWiggle{
    0%,100%{transform:rotate(0deg) scale(1);}
    15%{transform:rotate(-9deg) scale(1.1);}
    30%{transform:rotate(8deg) scale(1.18);}
    45%{transform:rotate(-7deg) scale(1.26);}
    62%{transform:rotate(6deg) scale(1.34);}
    80%{transform:rotate(-3deg) scale(1.15);}
  }
  .evo-wiggle{animation:evoWiggle .95s ease-in-out both;transform-origin:50% 80%;}
  @keyframes evoFlash{
    0%{opacity:0;transform:scale(.55);}
    28%{opacity:1;transform:scale(1.02);}
    100%{opacity:0;transform:scale(1.4);}
  }
  .evo-flash{animation:evoFlash .95s ease-out both;}
  @keyframes petPop{
    0%{transform:scale(.25);}
    55%{transform:scale(1.22);}
    78%{transform:scale(.94);}
    100%{transform:scale(1);}
  }
  .pet-pop{animation:petPop .55s cubic-bezier(.34,1.56,.64,1) both;transform-origin:50% 100%;}
  @keyframes zfloat{
    0%{opacity:0;transform:translate(0,8px) rotate(-8deg);}
    22%{opacity:1;}
    100%{opacity:0;transform:translate(16px,-40px) rotate(14deg);}
  }
  .zzz{position:absolute;animation:zfloat 3s linear infinite;}
  /* §2.5 HUD battle: thanh TT nhấp nháy mẫu vạch dày nhất palette khi <30% */
  @keyframes hudBlink{
    0%,54%{opacity:1;}
    55%,100%{opacity:.4;}
  }
</style>

/* ============================================================
   PIXEL ART — kỹ thuật box-shadow (copy từ demo Memphis cũ)
   ============================================================ */
function PixelArt({ grid, palette, scale = 6, style }){
  const shadows = [];
  grid.forEach((row, y) => {
    row.split('').forEach((ch, x) => {
      if (ch !== '.' && palette[ch]) shadows.push(`${x*scale}px ${y*scale}px 0 ${palette[ch]}`);
    });
  });
  const w = grid[0].length * scale, h = grid.length * scale;
  return (
    <div style={{ width:w, height:h, position:'relative', flexShrink:0, ...style }}>
      <div style={{ position:'absolute', top:0, left:0, width:scale, height:scale, boxShadow:shadows.join(',') }} />
    </div>
  );
}

/* ============================================================
   §2.5 PET TILE — sân khấu Memphis cho sprite MÀU (thay màn DMG):
   thẻ giấy kem viền mực + bóng cứng lệch + xoay nhẹ theo chất Memphis.
   lite = bản mỏng cho sprite nhỏ (timeline, cây, hero strip).
   ============================================================ */
function PetTile({ scale = 8, rotate = 0, lite = false, style, children }){
  return (
    <div style={{
      background:'var(--paper)',
      border: lite ? '2.5px solid var(--ink)' : '3px solid var(--ink)',
      boxShadow: lite ? '3px 3px 0 var(--ink)' : '6px 6px 0 var(--ink)',
      padding: lite ? Math.max(4, Math.round(scale / 2)) : scale,
      lineHeight: 0,
      display:'inline-block',
      transform: rotate ? `rotate(${rotate}deg)` : undefined,
      ...style,
    }}>{children}</div>
  );
}

/* ============================================================
   §2.5 HUD BATTLE GEN-1 (cấu trúc giữ nguyên: tên + Lv + TT + 78/100)
   nhưng thanh HP MÀU KIỂU POKÉMON: xanh lá ≥50% · vàng 20–49% ·
   đỏ <20%; ốm yếu (critical) → đỏ + nhấp nháy. Box = thẻ giấy Memphis.
   ============================================================ */
function BattleHUD({ name, level, value, max = 100, critical = false, style }){
  const SEGS = 10;
  const pct = value / max * 100;
  const filled = Math.max(0, Math.min(SEGS, Math.round(pct / 100 * SEGS)));
  const hpColor = critical ? '#D84028' : (pct >= 50 ? '#4CA83D' : (pct >= 20 ? '#E8B830' : '#D84028'));
  return (
    <div style={{ background:'var(--paper)', border:'3px solid var(--ink)', boxShadow:'4px 4px 0 var(--ink)', padding:'4px 9px 5px', minWidth:172, display:'inline-block', ...style }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:10 }}>
        <span className="f-mono" style={{ fontSize:13.5, fontWeight:700, letterSpacing:1, color:'var(--ink)' }}>{name}</span>
        <span className="f-mono" style={{ fontSize:11, fontWeight:700, color:'var(--ink)' }}>Lv.{level}</span>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:4 }}>
        <span className="f-mono" title="TT = Thể trạng" style={{ fontSize:11, fontWeight:700, color:'var(--ink)' }}>TT</span>
        <div style={{ display:'flex', gap:2, flex:1, border:'2px solid var(--ink)', padding:2, background:'var(--cream2)' }}>
          {Array.from({ length:SEGS }, (_, i) => (
            <div key={i} style={{
              flex:1, height:8,
              background: i < filled ? hpColor : 'rgba(38,32,29,.12)',
              ...(critical && i < filled ? { animation:'hudBlink .8s steps(1,end) infinite' } : null),
            }} />
          ))}
        </div>
      </div>
      <div className="f-mono" style={{ fontSize:10.5, fontWeight:700, textAlign:'right', color:'var(--ink)', marginTop:3 }}>{value}/{max}</div>
    </div>
  );
}

/* ============================================================
   §2.5 SPRITE PIXEL-ART — CHUẨN HIỆN TẠI v3: POKÉMON MÀU,
   PHỨC TẠP TĂNG THEO STAGE (bỏ chuẩn đơn sắc DMG theo feedback).
   · Tham chiếu bộ starter thật: Charmander → Charmeleon → Charizard
     (Lửa) · Squirtle → Wartortle → Blastoise (Thủy) ·
     Bulbasaur → Ivysaur → Venusaur (Thảo) — GIỮ tên sinh vật Việt.
   · Nguồn dáng + màu: sprite chuẩn tách ảnh mẫu user duyệt
     (direction-approved.md · sprites/ref/*.png) qua game-grid 32/40/48
     (scripts/gen-grids-from-ref.py) — embed data ở khối dưới.
   · CÓ MÀU: outline tối gần đen ("o"), thân 2–3 tông + highlight,
     grid ≥24×24 (stage 1: 32 · stage 2: 40 · stage 3: 48).
   · ĐỘ PHỨC TẠP TĂNG: stage 1 tròn nhỏ ngố (1 đặc trưng nguyên tố) →
     stage 2 cao + chi tiết hơn (bờm/vây/nụ, lửa to hơn, mắt dữ) →
     stage 3 ĐỔI HẲN DÁNG (rồng / thuồng luồng / cổ thụ + đặc trưng
     huyền thoại: bờm lửa, vây gai, tán cây nở).
   Ký tự theo palette từng hệ (FIRE/WATER/GRASS_PAL): "o" outline,
   d/f/l/h thân 4 tông, c/C bụng kem, y/Y nguyên tố sáng, a/e khói (ốm).
   ============================================================ */
const INK = '#26201D';

/* §2.4 điểm 4: biến thể ốm = palette NHỢT/desaturate — fallback cho form
   KHÔNG có grid ốm riêng (outline K vẫn giữ đậm để không biến mất).
   Demo này Tàn Lửa có grid ốm vẽ riêng (TAN_LUA_SICK + PALS.TAN_LUA_SICK). */
function paleHex(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16 & 255, g2 = n >> 8 & 255, b = n & 255;
  const lum = 0.2126 * r + 0.7152 * g2 + 0.0722 * b;
  const mix = (c) => Math.round(c * 0.3 + lum * 0.42 + 255 * 0.28);
  return 'rgb(' + mix(r) + ',' + mix(g2) + ',' + mix(b) + ')';
}
function palePal(pal){
  const out = {};
  Object.keys(pal).forEach((k) => { out[k] = k === 'K' ? pal.K : paleHex(pal[k]); });
  return out;
}

/* ============================================================
   §1.3 REGISTRY ĐIỀU KIỆN (dùng chung, combo AND/OR)
   Thêm loại điều kiện mới = đăng ký 1 key, KHÔNG sửa hệ cũ.
   ============================================================ */
const COND = {
  level_at_least:          (s, v) => s.level  >= v,
  power_at_least:          (s, v) => s.power  >= v,
  streak_at_least:         (s, v) => s.streak >= v,
  healthy_days_at_least:   (s, v) => s.healthyDays >= v,
  sessions_today_at_least: (s, v) => s.todaySessions >= v,
  and: (s, of) => of.every((c) => evalCond(s, c)),
  or:  (s, of) => of.some((c) => evalCond(s, c)),
};
function evalCond(s, c){
  if (c.op) return COND[c.op](s, c.of);
  return COND[c.key](s, c.value);
}
const COND_LABEL = {
  level_at_least:          ['Lv',                (v) => '≥ ' + v],
  power_at_least:          ['Sức mạnh',          (v) => '≥ ' + v],
  streak_at_least:         ['streak',            (v) => '≥ ' + v + ' ngày'],
  healthy_days_at_least:   ['Khỏe mạnh liên tục',(v) => '≥ ' + v + ' ngày'],
  sessions_today_at_least: ['phiên hôm nay',     (v) => '≥ ' + v],
};
function describeCond(c){
  if (c.op === 'and') return c.of.map(describeCond).join(' ∧ ');
  if (c.op === 'or')  return c.of.map(describeCond).join(' ∨ ');
  const L = COND_LABEL[c.key];
  return L[0] + ' ' + L[1](c.value);
}

  power_at_least:          (s) => s.power,

function Deco({ t, color, size=44, rotate=0, style }){
  const common = { position:'absolute', width:size, height:size, transform:`rotate(${rotate}deg)`, ...style };
  if (t === 'squiggle') return <svg style={common} viewBox="0 0 44 16"><path d="M2 12 Q 8 2 14 12 T 26 12 T 38 12" fill="none" stroke={color} strokeWidth="3.5" strokeLinecap="round"/></svg>;
  if (t === 'zigzag')   return <svg style={common} viewBox="0 0 44 14"><polyline points="2,12 9,2 16,12 23,2 30,12 37,2 42,10" fill="none" stroke={color} strokeWidth="3.5" strokeLinejoin="round"/></svg>;
  if (t === 'dots')     return <svg style={common} viewBox="0 0 44 44">{[0,1,2].map(r => [0,1,2].map(c => <circle key={`${r}${c}`} cx={8+c*14} cy={8+r*14} r="4" fill={color} />))}</svg>;
  if (t === 'tri')      return <svg style={common} viewBox="0 0 44 44"><polygon points="22,4 40,40 4,40" fill="none" stroke={color} strokeWidth="3.5" strokeLinejoin="round"/></svg>;
  if (t === 'ring')     return <svg style={common} viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="none" stroke={color} strokeWidth="4"/></svg>;
  if (t === 'plus')     return <svg style={common} viewBox="0 0 44 44"><path d="M22 6v32M6 22h32" stroke={color} strokeWidth="4" strokeLinecap="round"/></svg>;
  if (t === 'half')     return <svg style={common} viewBox="0 0 44 24"><path d="M4 20a18 18 0 0136 0" fill="none" stroke={color} strokeWidth="4" strokeLinecap="round"/></svg>;
  return null;
}

/* ============================================================
   PHONE = state-machine mini độc lập (4 tab + màn evolve trong tab Tập)
   ============================================================ */
const TABS = [
  { id:'egg',   label:'Trứng', on:'var(--mustard)', tx:'var(--ink)' },
  { id:'train', label:'Tập',   on:'var(--red)',     tx:'var(--paper)' },
  { id:'feed',  label:'Ăn',    on:'var(--olive)',   tx:'var(--paper)' },
  { id:'stats', label:'Stats', on:'var(--blue)',    tx:'var(--paper)' },
];
const TAB_ROT = ['-1.6','1.2','-1','1.6'];

function TabBar({ tab, setTab }){
  return (
    <div style={{ padding:'10px 12px 14px', background:'var(--cream)', borderTop:'3px solid var(--ink)', display:'flex', gap:8 }}>
      {TABS.map((t,i) => {
        const on = tab === t.id;
        return (
          <button key={t.id} className={`ptab${on ? ' on' : ''}`}
                  style={{ '--tr':`${TAB_ROT[i]}deg`, ...(on ? { background:t.on, color:t.tx } : null) }}
                  onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        );
      })}
    </div>
  );
}

/* §3 State fixture dùng chung — mỗi phone clone một bản riêng */
const FIXTURE = {
  level:4, xp:120, power:62, condition:78, coins:12,
  streak:7, todaySessions:3, todayMinutes:112, healthyDays:3,
};

function PhoneApp({ initialTab='egg', initialScreen='focus' }){
  const [tab, setTab] = useState(initialTab);
  const [screen, setScreen] = useState(initialScreen); // trong tab Tập: 'focus' | 'evolve'
  const [pet, setPet] = useState({ ...FIXTURE });
  const [paused, setPaused] = useState(false);
  const [fed, setFed] = useState(false);
  const [picked, setPicked] = useState('flame');
  const [adoptMsg, setAdoptMsg] = useState(null);

  const flame = lineById('flame');
  const stage = flame.stages[0];          // hero: Tàn Lửa
  const sick = pet.condition < 30;        // §3: <30 → Ốm yếu (sprite ốm)

  const feed = () => {
    if (pet.coins > 0){
      setPet((p) => ({ ...p, coins:p.coins - 1, xp:p.xp + 5, condition:Math.min(100, p.condition + 15) }));
      setFed(true);
    }
  };
  const neglect5 = () => {
    // decay §3 đọc từ SYSTEMS[].decay — 5 ngày không phiên
    const perIdle = SYSTEMS.find((s) => s.id === 'power').decay.perIdleDay;
    setPet((p) => ({ ...p, power:Math.max(0, p.power + perIdle * 5), condition:Math.max(0, p.condition - 10 * 5) }));
  };

  let screenEl;
  if (tab === 'egg'){
    screenEl = (
      <EggScreen picked={picked} onPick={setPicked} msg={adoptMsg}
        onAdopt={() => setAdoptMsg(
          picked === 'flame'
            ? 'Tàn Lửa đã theo bạn về nhà — cho ăn và tập focus để tiến hoá nhé!'
            : lineById(picked).stages[0].name + ' cũng đáng yêu lắm — nhưng demo này bám số liệu của line Lửa!'
        )} />
    );
  } else if (tab === 'train'){
    screenEl = screen === 'evolve'
      ? <EvolveScreen pet={pet} sick={sick} onBack={() => setScreen('focus')} />
      : <FocusScreen pet={pet} paused={paused} sick={sick} stage={stage}
          onTogglePause={() => setPaused((p) => !p)} onShowEvolve={() => setScreen('evolve')} />;
  } else if (tab === 'feed'){
    screenEl = <FeedScreen pet={pet} fed={fed} sick={sick} stage={stage} onFeed={feed} />;
  } else {
    screenEl = <StatsScreen pet={pet} sick={sick} stage={stage} onNeglect={neglect5} />;
  }

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:'var(--cream)' }}>
      <div style={{ flex:1, overflow:'hidden' }}>
        <div style={{ height:'100%', overflowY:'auto' }}>{screenEl}</div>
      </div>
      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
}

                <TreeLine key={line.id} line={line} known={line.id === 'flame'} first={i === 0} />
              ))}
            </div>
          </Block>

          <Block bg="var(--purple)" rotate={0.6} pad={14}>
            <div className="f-bungee" style={{ fontSize:13.5, color:'var(--paper)' }}>NHÁNH STAGE 3 — ĐIỀU KIỆN TỪ REGISTRY COND</div>
            <div style={{ display:'flex', gap:12, marginTop:10, flexWrap:'wrap' }}>
              {flame.branches.map((b, i) => <BranchCard key={b.id} b={b} pet={pet} rotate={i === 0 ? -1 : 0.9} />)}
            </div>
          </Block>

          <Block bg="var(--cream2)" rotate={-0.7} pad={14} tape="var(--blue)">
            <div className="f-bungee" style={{ fontSize:13.5 }}>FORM LAI HIẾM — ĐIỀU KIỆN KÉP (hệ {hybridUi.system.id})</div>
            <div style={{ display:'flex', gap:12, marginTop:10, flexWrap:'wrap' }}>
              {CATALOG.hybrids.map((h, i) => <HybridCard key={h.id} h={h} pet={pet} rotate={[-0.8, 0.9, -0.6][i]} />)}
            </div>
          </Block>
        </div>

        {/* CỘT PHẢI — stats + pet mini + đồng bộ + kiến trúc mở */}
        <div style={{ flex:1, display:'flex', flexDirection:'column', gap:22, minWidth:280 }}>
          <Block bg="var(--red)" rotate={0.8} pad={16} tape="var(--mustard)">
            <div className="f-bungee" style={{ fontSize:20, color:'var(--paper)' }}>STREAK 7 NGÀY 🔥</div>
            <div className="f-mono" style={{ fontSize:12.5, color:'var(--paper)', marginTop:2 }}>7 ngày liên tiếp · không đứt đoạn</div>
            <DayCells scale={4} />
          </Block>

          <Block bg="var(--mustard)" rotate={-0.7} pad={16}>
            <div className="f-mono" style={{ fontSize:12.5, fontWeight:700 }}>HÔM NAY</div>
            <div style={{ display:'flex', alignItems:'baseline', gap:10, marginTop:2, flexWrap:'wrap' }}>
              <span className="f-bungee" style={{ fontSize:44 }}>112</span>
              <span className="f-serif" style={{ fontSize:21 }}>phút</span>
              <span className="f-bungee" style={{ fontSize:28, color:'var(--red)' }}>· 3</span>
              <span className="f-serif" style={{ fontSize:21 }}>phiên</span>
              <span className="f-mono" style={{ fontSize:13, fontWeight:700, marginLeft:'auto' }}>+120 XP</span>
            </div>
          </Block>

          <Block bg="var(--cream2)" rotate={0.9} pad={16} tape="var(--red)">
            <div style={{ display:'flex', gap:16, alignItems:'center' }}>
              <div style={{ position:'relative', flexShrink:0 }}>
                <div className="pet-bounce">
                  <PetTile lite scale={4} rotate={1.2}>
                    <PetSprite stage={stage} scale={4} />
                  </PetTile>
                </div>
                <NameTag name="TÀN LỬA" />
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="f-serif" style={{ fontStyle:'italic', fontSize:17 }}>hổ lửa con · Lv.4</div>
                <div className="f-mono" style={{ fontSize:12.5, fontWeight:700, margin:'10px 0 5px' }}>120/200 XP</div>
                <div style={{ height:13, border:'3px solid var(--ink)', background:'var(--paper)' }}>
                  <div style={{ width:'60%', height:'100%', background:'repeating-linear-gradient(45deg, var(--red) 0 7px, var(--red2) 7px 14px)' }} />
                </div>
                <div style={{ marginTop:10 }}>
                  <CapMeter label="Sức mạnh" value={pet.power} cap={FORMULAS.powerCap(pet.level)} level={pet.level} c1="var(--red)" c2="var(--red2)" />
                </div>
                <div style={{ marginTop:10 }}>
                  <Meter label={`Thể trạng · ${condStatus(pet.condition)}`} value={pet.condition} max={100} c1="var(--purple)" c2="var(--purple2)" />
                </div>
              </div>
            </div>
          </Block>

          <Block bg="var(--blue)" rotate={-0.9} pad={16}>
            <div className="f-bungee" style={{ fontSize:14, color:'var(--paper)', marginBottom:12 }}>ĐỒNG BỘ · WEB ↔ ANDROID</div>
            <SyncPanel />
            <div className="f-mono" style={{ fontSize:12.5, color:'var(--paper)', marginTop:12 }}>
              Streak, pet và cây tiến hoá theo bạn đi khắp mọi màn hình — đăng nhập một lần.
            </div>
          </Block>

          <Block bg="var(--paper)" rotate={0.7} pad={14} tape="var(--olive)">
            <div className="f-bungee" style={{ fontSize:13 }}>KIẾN TRÚC MỞ — UI ĐỌC TỪ SYSTEMS[].UI</div>
            <div style={{ marginTop:8 }}>
              {SYSTEMS.map((sy) => (
                <div key={sy.id} className="f-mono" style={{ display:'flex', justifyContent:'space-between', gap:10, fontSize:12, padding:'6px 0', borderBottom:'2px dashed rgba(38,32,29,.3)' }}>
                  <span style={{ fontWeight:700 }}>{sy.id}</span>
                  <span style={{ textAlign:'right', opacity:.85 }}>
                    {(sy.ui || []).map((u) => u.slot + ':' + u.type).join(' · ') || '—'}
                  </span>
                </div>
              ))}
            </div>
            <div className="f-mono" style={{ fontSize:11, marginTop:8, opacity:.8 }}>
              thêm hệ mới = thêm 1 entry (xem comment §1.6 trong source) — core không đổi
            </div>
          </Block>

          <Block bg="var(--paper)" rotate={1.2} pad={14} tape="var(--blue)">
            <div className="f-serif" style={{ fontStyle:'italic', fontSize:19, lineHeight:1.35 }}>
              "Tàn Lửa hôm nay là than hồng — trò focused enough, mai thành Bồng Bột."
            </div>
            <div className="f-mono" style={{ fontSize:12, marginTop:6 }}>— sổ tay nuôi bé, trang 7</div>
          </Block>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   TRANG DEMO
   ============================================================ */
function Confetti(){
  const items = [
    ['tri','var(--purple)',70,-14,'1.5%','2%'],
    ['ring','var(--red)',96,10,'88%','3%'],
    ['zigzag','var(--mustard)',120,-6,'76%','12%'],
    ['dots','var(--olive)',80,8,'1%','20%'],
    ['plus','var(--blue)',44,18,'93%','25%'],
    ['squiggle','var(--red)',90,-10,'2.5%','36%'],
    ['half','var(--purple)',70,12,'91%','42%'],
    ['dots','var(--red)',70,-6,'86%','56%'],
    ['tri','var(--olive)',56,20,'0.5%','54%'],
    ['ring','var(--mustard)',64,-8,'94%','70%'],
    ['squiggle','var(--blue)',100,8,'1%','72%'],
    ['plus','var(--red)',40,-15,'46%','2.5%'],
    ['zigzag','var(--purple)',90,10,'44%','95%'],
    ['dots','var(--mustard)',64,0,'28%','88%'],
  ];
  return (
    <div style={{ position:'absolute', inset:0, pointerEvents:'none', zIndex:0 }}>
      {items.map((it,i) => <Deco key={i} t={it[0]} color={it[1]} size={it[2]} rotate={it[3]} style={{ top:it[4], left:it[5] }} />)}
    </div>
  );
}

function HeroStrip(){
  const flame = lineById('flame');
  return (
    <div style={{ position:'relative', marginTop:26, display:'inline-block' }}>
      <div style={{ position:'absolute', inset:'0 -14px', background:'var(--mustard)', border:'3px solid var(--ink)', boxShadow:'7px 7px 0 var(--ink)', transform:'rotate(-1deg)' }} />
      <div style={{ position:'relative', display:'flex', alignItems:'center', gap:16, padding:'16px 30px 12px', flexWrap:'wrap' }}>
        <PetTile lite scale={4} rotate={-2}><PixelArt grid={eggGridFor(flame)} palette={EGG_PAL[flame.eggPat]} scale={4} /></PetTile>
        <svg width="22" height="18" viewBox="0 0 22 18"><path d="M2 9h14M12 3l6 6-6 6" fill="none" stroke="var(--ink)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>
        {flame.stages.map((st, i) => (
          <React.Fragment key={st.id}>
            <div style={{ textAlign:'center' }}>
              <div className="pet-bounce" style={{ animationDelay:`${i*0.25}s`, display:'inline-block' }}>
                <PetTile lite scale={2} rotate={i === 1 ? 1.5 : -1.5}>
                  <PixelArt grid={st.grid} palette={st.pal} scale={2} />
                </PetTile>
              </div>
              <div className="f-bungee" style={{ fontSize:12.5, marginTop:2 }}>{st.name}</div>
              <div className="f-mono" style={{ fontSize:10.5, opacity:.8 }}>Lv ≥ {st.atLevel}</div>
            </div>
            {i < flame.stages.length - 1 && (
              <svg width="22" height="18" viewBox="0 0 22 18"><path d="M2 9h14M12 3l6 6-6 6" fill="none" stroke="var(--ink)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>
            )}
          </React.Fragment>
        ))}
        <div className="f-mono" style={{ fontSize:11.5, maxWidth:230, marginLeft:10, opacity:.85 }}>
          hero của kịch bản này: line <b>Lửa</b> — nhánh Stage 3 + biến thể ốm yếu đều demo được
        </div>
      </div>
    </div>
  );
}

      </div>

      <div style={{ position:'relative' }}>

          chọn trứng → tập focus → khoảnh khắc tiến hoá → cây tiến hoá
        </div>
      </div>

      <HeroStrip />

      <p className="f-mono" style={{ fontSize:15, lineHeight:1.75, maxWidth:920, margin:'26px 0 0', position:'relative' }}>
        Demo kịch bản gameplay <b>v2</b> trên chất liệu <b style={{ color:'var(--red)' }}>Memphis Maximalism</b>:
        thẻ xoay nghiêng, sticker đập vào mắt, viền mực 3px và bóng đổ cứng.
        Hành trình của bé: chọn 1 trong 3 trứng nguyên tố, ngồi tập trung để đẩy XP và Sức mạnh,
        chứng kiến khoảnh khắc <b style={{ color:'var(--mustardInk)' }}>tiến hoá</b> (lóe sáng — rung — đổi dáng hẳn),
        rồi ngắm <b style={{ color:'var(--blue)' }}>cây tiến hoá</b> cả 3 line trên desktop.
        Thử cả hai nút mô phỏng: <b>"Mô phỏng tiến hoá"</b> trên phone ③ và
        <b> "Mô phỏng bỏ bê 5 ngày"</b> trên phone ④ — level giữ nguyên nhưng ngoại hình rũ xuống.
      </p>

      <div style={{ marginTop:16, display:'flex', gap:10, flexWrap:'wrap', alignItems:'center' }}>
        <Chip rotate={-0.6}>FIXTURE CHUNG §3</Chip>
        <span className="f-mono" style={{ fontSize:12.5, fontWeight:700 }}>
          Lv.4 · 120/200 XP · Sức mạnh 62/64 · Thể trạng 78 (Khỏe mạnh) · 12 sushi · Streak 7 · Hôm nay 112 phút / 3 phiên · phiên chạy 24:31 (2/4)
        </span>
      </div>
    </header>
  );
}

function PageFooter(){
  return (
    <footer style={{ textAlign:'center', padding:'28px 24px 64px', position:'relative', zIndex:1 }}>
      <Deco t="zigzag" color="var(--red)" size={120} style={{ position:'static', margin:'0 auto 14px', transform:'rotate(-2deg)', display:'block' }} />
      <div className="f-mono" style={{ fontSize:14 }}>Pet Pomodoro — gameplay v2 · kịch bản 1/3 · demo duyệt thiết kế, bản thật sẽ build Nuxt (web) + Kotlin (Android)</div>

function DeviceLabel({ text, color, offset=0, children }){

        {text}
      </div>
      {children}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
