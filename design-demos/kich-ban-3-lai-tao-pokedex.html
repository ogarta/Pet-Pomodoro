<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kịch bản 3 · Lai tạo &amp; Pokédex — Pet Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    /* Màn MÀU lit-LCD kiểu GBC (spec §2.5 v3) — sprite Pokémon màu sống trên nền sáng,
       vỏ máy + nút bấm giữ chất DMG console */
    --ink: #35502E;        /* darkest trên màn — chữ, viền chip */
    --ink2: #6B8258;       /* phụ — label, số phụ */
    --lcd: #D9E6C9;        /* nền màn sáng */
    --lcd-body: #C3D8A6;   /* tông thân chip/panel */
    --scr-line: #8FA47A;   /* viền khung màn */
    --hp-hi: #45B54E;      /* HP kiểu Pokemon: xanh ≥50% */
    --hp-mid: #F2C23E;     /* vàng 20–49% */
    --hp-low: #E5483C;     /* đỏ <20% */
    --red: #C13E31;        /* chỉ dùng cho VỎ MÁY (shell) */
    --red-d: #8E271E;
    --amber: #B3672B;
    --rose: #B04A6B;
    --leaf: #4E7A28;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
    background:
      repeating-linear-gradient(0deg, rgba(122,100,62,.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(90deg, rgba(122,100,62,.05) 0 2px, transparent 2px 26px),
      #E9DCC3;
    color: #4A3F2C;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .pixelfont { font-family: 'VT323', monospace; }
  .psp { font-family: 'Press Start 2P', monospace; }

  /* ---------- demo page ---------- */
  .page { padding: 44px 48px 64px; }
  .page-head { margin-bottom: 32px; border-bottom: 3px solid rgba(122,100,62,.25); padding-bottom: 20px; }
  .page-head h1 { font-size: 27px; font-weight: 800; color: #574726; letter-spacing: .2px; }
  .page-head p { font-size: 15.5px; color: #6D5D40; margin-top: 8px; max-width: 1180px; line-height: 1.55; }
  .page-head p b { color: #574726; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .demo-item { display: flex; flex-direction: column; align-items: center; }
  .demo-label { font-style: italic; font-size: 15px; color: #6D5D40; margin-bottom: 10px; font-weight: 600; }

  /* ---------- console shell ---------- */
  .pshell {
    height: 100%;
    display: flex; flex-direction: column;
    padding: 34px 0 26px;
    border-top: 4px solid rgba(255,255,255,.55);
    border-bottom: 4px solid rgba(122,100,62,.18);
    box-shadow: inset 0 0 0 2px rgba(122,100,62,.16);
  }
  .shell-top { display: flex; align-items: center; justify-content: space-between; padding: 2px 20px 8px; flex-shrink: 0; }
  .pwr { display: flex; align-items: center; gap: 5px; }
  .led { width: 9px; height: 9px; border-radius: 50%; background: #E0492E; box-shadow: 0 0 6px rgba(224,73,46,.85); }
  .pwr .psp { font-size: 12px; color: #6E5F45; }
  .wordmark { font-size: 12px; color: #574726; letter-spacing: 1px; }
  .model { font-size: 12.5px; font-weight: 800; color: #6E5F45; letter-spacing: 1.5px; }

  .bezel {
    flex: 1; margin: 0 14px; min-height: 0;
    background: #4E483C; border: 3px solid #37322A;
    border-radius: 16px 16px 22px 22px;
    padding: 11px 11px 5px;
    display: flex; flex-direction: column;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.10), 0 3px 0 rgba(122,100,62,.25);
  }
  .bezel-cap { text-align: center; color: #CFC7B4; font-size: 14px; letter-spacing: 1px; padding: 3px 0 2px; flex-shrink: 0; }
  .lcd-main { flex: 1; min-height: 0; }

  .lcdp {
    position: relative; background: var(--lcd);
    border: 2px solid var(--scr-line); border-radius: 10px; overflow: hidden;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(53,80,46,.16);
  }
  .lcd-grid {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background:
      repeating-linear-gradient(0deg, rgba(53,80,46,.05) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(53,80,46,.045) 0 1px, transparent 1px 3px);
  }
  .lcd-glare {
    position: absolute; top: -40%; left: -18%; width: 46%; height: 190%;
    background: linear-gradient(100deg, rgba(255,255,246,.13), rgba(255,255,246,0) 70%);
    transform: rotate(8deg); pointer-events: none; z-index: 31;
  }
  .lcd-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; padding: 12px 12px 10px; overflow: hidden; }
  .screen-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .screen-scroll::-webkit-scrollbar { width: 0; }

  /* ---------- screens ---------- */
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .scr-title { font-family: 'VT323', monospace; font-size: 25px; color: var(--ink); text-align: center; line-height: 1.05; }
  .scr-sub { text-align: center; font-size: 13px; color: var(--ink2); font-weight: 600; margin-top: 2px; }
  .sec-label {
    font-size: 11.5px; font-weight: 800; letter-spacing: .8px; color: var(--ink2);
    border-bottom: 2px dashed rgba(53,80,46,.3); padding-bottom: 2px; margin: 6px 0 5px;
  }

  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .status-chip {
    font-size: 12.5px; font-weight: 800; letter-spacing: .8px;
    padding: 3px 9px; border: 2px solid var(--ink); border-radius: 4px;
    background: rgba(195,216,166,.62); color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .status-chip::before { content: ''; width: 8px; height: 8px; background: currentColor; border-radius: 2px; flex-shrink: 0; }
  .status-chip.go { background: var(--ink); color: var(--lcd); }
  .status-chip.warn { border-color: var(--ink2); color: var(--ink); background: rgba(195,216,166,.45); }
  .status-chip.rest { border-color: var(--ink2); color: var(--ink); background: rgba(195,216,166,.45); }
  .status-chip.bad { border-color: var(--hp-low); color: #B3372A; background: #F6DFD3; animation: blink 1s steps(1) infinite; }
  .status-chip.idle { color: var(--ink2); }
  .session { font-size: 19px; color: var(--ink2); letter-spacing: 1px; }

  .timer-wrap { position: relative; text-align: center; line-height: .82; margin: 4px 0 2px; }
  .timer { font-size: 84px; color: var(--ink); position: relative; z-index: 2; }
  .timer-ghost { position: absolute; left: 0; right: 0; top: 0; font-size: 84px; color: rgba(53,80,46,.08); z-index: 1; }

  .stage {
    position: relative; height: 126px; margin: 4px 6px 8px;
    background: rgba(195,216,166,.14);
    border: 2px solid rgba(53,80,46,.35); border-radius: 8px; overflow: hidden;
  }
  .pet { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); }
  .pet.hop { animation: hop .5s steps(1, end) infinite alternate; }
  @keyframes hop { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-9px); } }
  /* ỐM (spec §2.4): shiver ±1px ~400ms + mồ hôi + vũng bóng tối + bubble "…" */
  .pet.shiver { animation: shiver .4s steps(1) infinite; }
  @keyframes shiver {
    0% { transform: translateX(-50%) translateY(0); }
    25% { transform: translateX(calc(-50% - 1px)) translateY(-1px); }
    50% { transform: translateX(-50%) translateY(0); }
    75% { transform: translateX(calc(-50% + 1px)) translateY(1px); }
    100% { transform: translateX(-50%) translateY(0); }
  }
  .sick-puddle { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); width: 62%; height: 9px; background: rgba(53,80,46,.2); border-radius: 50%; }
  .sick-bubble {
    position: absolute; top: 6px; left: 63%; z-index: 7;
    font-family: 'VT323', monospace; font-size: 19px; line-height: 1; color: var(--ink);
    background: rgba(255,255,252,.88); border: 2px solid var(--ink); border-radius: 8px;
    padding: 1px 7px 2px; animation: blink 1.2s steps(1) infinite;
  }
  .sweat { position: absolute; z-index: 7; animation: sweatfly 1.1s steps(4) infinite; }
  @keyframes sweatfly { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(-7px,-15px); } }
  .ground { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 3px; background: rgba(53,80,46,.4); border-radius: 2px; }
  .grass { position: absolute; bottom: 8px; }
  .petname {
    position: absolute; top: 5px; left: 8px;
    font-family: 'VT323', monospace; font-size: 17px; color: var(--ink2); letter-spacing: 1px;
  }

  .xp-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
  .lv-chip { background: var(--ink); color: var(--lcd); font-size: 17px; padding: 1px 8px; border-radius: 4px; letter-spacing: 1px; }
  .xp-bar { flex: 1; height: 12px; display: flex; gap: 3px; padding: 2px; border: 2px solid rgba(53,80,46,.55); border-radius: 4px; }
  .xp-bar i { flex: 1; background: rgba(53,80,46,.13); border-radius: 1px; }
  .xp-bar i.on { background: var(--ink); }
  .xp-num { font-size: 17px; color: var(--ink2); letter-spacing: .5px; }

  .meters { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
  .mini-label { font-size: 12.5px; font-weight: 800; letter-spacing: .4px; color: var(--ink2); }
  .meter-note { font-family: 'VT323', monospace; font-size: 16px; color: var(--ink2); }

  .foot-row { margin-top: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 8px; }

  .lcdbtn {
    cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 13.5px; letter-spacing: .3px;
    color: var(--ink); background: rgba(195,216,166,.62);
    border: 2px solid var(--ink); border-radius: 8px; padding: 8px 12px;
    box-shadow: 3px 3px 0 rgba(53,80,46,.75);
    transition: transform .06s, box-shadow .06s, background .12s;
  }
  .lcdbtn:hover { background: rgba(195,216,166,.9); }
  .lcdbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(53,80,46,.75); }
  .lcdbtn.primary { background: var(--ink); color: var(--lcd); }
  .lcdbtn.primary:hover { background: #44633A; }
  .lcdbtn.big { width: 100%; padding: 9px 12px; font-size: 15px; }
  .lcdbtn:disabled { opacity: .55; cursor: not-allowed; }

  /* egg screen */
  .egg-card {
    cursor: pointer; display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; background: rgba(195,216,166,.28);
    border: 2px solid rgba(53,80,46,.4); border-radius: 10px; position: relative;
    transition: background .12s, transform .06s;
    box-shadow: 2px 2px 0 rgba(53,80,46,.25);
  }
  .egg-card:hover { background: rgba(195,216,166,.5); }
  .egg-card:active { transform: translate(1px, 1px); }
  .egg-card.sel { border: 3px solid var(--ink); background: rgba(195,216,166,.55); box-shadow: 3px 3px 0 rgba(53,80,46,.55); }
  .egg-slot {
    width: 62px; height: 58px; display: flex; align-items: center; justify-content: center;
    background: rgba(53,80,46,.08); border-radius: 8px;
    border: 2px dashed rgba(53,80,46,.3); flex-shrink: 0;
  }
  .egg-slot.sel { border-style: solid; border-color: var(--ink); background: rgba(195,216,166,.5); }
  .egg-name { font-size: 16.5px; font-weight: 800; color: var(--ink); text-align: left; }
  .egg-sub { font-size: 12.5px; color: var(--ink2); font-weight: 600; text-align: left; margin-top: 1px; }
  .chip-sel {
    position: absolute; top: -9px; right: 10px;
    background: var(--ink); color: var(--lcd);
    font-size: 12px; font-weight: 800; letter-spacing: .5px;
    padding: 1px 7px; border-radius: 4px; border: 2px solid rgba(53,80,46,.5);
  }
  .blink-tri {
    position: absolute; right: 12px; top: 50%; margin-top: -6px;
    width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    border-left: 9px solid var(--ink);
    animation: blink 1s steps(1) infinite;
  }
  .blink-tri.inline { position: static; display: inline-block; vertical-align: middle; margin-left: 8px; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  .adopted-box {
    background: rgba(195,216,166,.5); border: 2px dashed var(--ink); border-radius: 10px;
    padding: 10px; text-align: center; display: flex; flex-direction: column; gap: 8px;
    font-size: 14px; color: var(--ink); font-weight: 600;
  }

  /* feed screen */
  .happy-banner {
    margin: 6px auto 2px; text-align: center;
    font-family: 'VT323', monospace; font-size: 21px; color: #8A5A20;
    background: #FBE7C0; border: 2px solid #B3672B; border-radius: 6px;
    padding: 2px 12px; width: fit-content;
    animation: pop .25s steps(3);
  }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .feed-row { display: flex; align-items: stretch; gap: 10px; }
  .sushi-plate { background: rgba(195,216,166,.35); border: 2px solid rgba(53,80,46,.4); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; }
  .hint-line { font-size: 12.5px; color: var(--ink2); font-weight: 600; margin-top: 9px; line-height: 1.4; }
  .heart { position: absolute; animation: heartup 1.4s steps(5) forwards; }
  @keyframes heartup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-32px); } }

  /* lai tạo / breed screen */
  .lean-opt {
    cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0;
    text-align: left;
    background: rgba(195,216,166,.28); border: 2px solid rgba(53,80,46,.4); border-radius: 8px;
    padding: 5px 8px; font-weight: 800; font-size: 12.5px; color: var(--ink);
    box-shadow: 2px 2px 0 rgba(53,80,46,.25);
    transition: background .12s, transform .06s;
    position: relative;
  }
  .lean-opt .lean-label { display: flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; }
  .lean-opt .lean-label span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lean-opt:hover { background: rgba(195,216,166,.5); }
  .lean-opt:active { transform: translate(1px, 1px); }
  .lean-opt.sel { border: 3px solid var(--ink); background: rgba(195,216,166,.6); box-shadow: 3px 3px 0 rgba(53,80,46,.5); }
  .lean-cursor { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid var(--ink); flex-shrink: 0; animation: blink 1s steps(1) infinite; }
  .lean-sub { font-weight: 600; font-size: 11px; color: var(--ink2); line-height: 1.2; }
  .lean-opt .pixelfont { font-size: 15px; }

  .form-box {
    position: relative; width: 84px; height: 92px; flex-shrink: 0;
    background: rgba(53,80,46,.08); border: 2px solid rgba(53,80,46,.35); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .form-box .cap {
    position: absolute; top: 2px; left: 0; right: 0; text-align: center;
    font-size: 10px; font-weight: 800; letter-spacing: .5px; color: var(--ink2); z-index: 3;
  }
  .form-box .qmark { font-family: 'VT323', monospace; font-size: 26px; color: #EFF5E4; position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; text-shadow: 0 0 2px rgba(53,80,46,.95), 1px 1px 0 rgba(53,80,46,.95), -1px 1px 0 rgba(53,80,46,.95); }
  .flashbox { animation: lcdflash 1s steps(1) 1; }
  @keyframes lcdflash {
    0%, 100% { filter: none; }
    8%, 24%, 40%, 56%, 72% { filter: brightness(2.1) saturate(.15) contrast(1.25); }
    16%, 32%, 48%, 64% { filter: brightness(.55); }
    88% { filter: brightness(1.6) saturate(.3); }
  }
  .morphin { animation: morphin .5s steps(4) 1; }
  @keyframes morphin { 0% { transform: scale(.25, 1.1); } 40% { transform: scale(1.2, .8); } 70% { transform: scale(.85, 1.15); } 100% { transform: scale(1, 1); } }

  .tag-rare {
    background: var(--red); color: #FFF3E6; font-size: 11.5px; font-weight: 800; letter-spacing: 1px;
    padding: 1px 7px; border-radius: 4px; border: 2px solid var(--red-d); white-space: nowrap;
  }
  .tag-branch { background: #8A6A1E; color: #FFF3D6; font-size: 11.5px; font-weight: 800; letter-spacing: 1px; padding: 1px 7px; border-radius: 4px; border: 2px solid #6E5316; white-space: nowrap; }

  .branch-card {
    background: rgba(195,216,166,.32); border: 2px solid rgba(53,80,46,.4); border-radius: 8px;
    padding: 6px 9px; font-size: 12.5px; color: var(--ink); font-weight: 600;
  }
  .branch-card.dim { opacity: .7; border-style: dashed; }
  .branch-card b { font-size: 13.5px; }
  .branch-card .pixelfont { font-size: 16px; color: var(--ink2); }

  .sick-line { font-family: 'VT323', monospace; font-size: 19px; color: #B3372A; text-align: center; animation: blink 1s steps(1) infinite; letter-spacing: 1px; }
  .decay-nums { font-family: 'VT323', monospace; font-size: 19px; color: var(--ink); letter-spacing: 1px; }

  /* cond bars */
  .cond-bar { display: flex; align-items: center; gap: 7px; }
  .cond-bar .mini-label { min-width: 108px; }
  .cond-cells { flex: 1; height: 13px; display: flex; gap: 2px; padding: 2px; border: 2px solid rgba(53,80,46,.55); border-radius: 4px; background: rgba(195,216,166,.18); }
  .cond-cells i { flex: 1; background: rgba(53,80,46,.13); border-radius: 1px; }
  .cond-cells i.on { background: #8FA47A; }
  .cond-cells i.done { background: var(--ink); }
  .cond-bar .pixelfont { font-size: 17px; color: var(--ink); min-width: 46px; text-align: right; }
  .cond-code {
    font-family: 'VT323', monospace; font-size: 21px; color: var(--ink);
    background: rgba(195,216,166,.5); border: 2px solid var(--ink); border-radius: 6px;
    padding: 1px 10px; display: inline-block; letter-spacing: .5px;
  }

  /* stats screen */
  .fire-row { display: flex; gap: 6px; margin: 8px 0; }
  .day-cell {
    flex: 1; background: rgba(195,216,166,.25); border: 2px solid rgba(53,80,46,.35);
    border-radius: 8px; padding: 6px 2px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .day-cell span { font-size: 12.5px; font-weight: 800; color: var(--ink2); }
  .day-cell.today { border-color: var(--ink); background: rgba(195,216,166,.55); }
  .fire.today { animation: firehop .6s steps(1) infinite alternate; }
  @keyframes firehop { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .fire-row.big .day-cell { padding: 10px 2px 8px; }

  .today-panel {
    display: flex; align-items: center; gap: 14px;
    background: rgba(195,216,166,.3); border: 2px solid rgba(53,80,46,.4);
    border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
  }
  .big-num { font-size: 44px; color: var(--ink); line-height: .8; }
  .v-sep { width: 2px; height: 40px; background: rgba(53,80,46,.25); border-radius: 2px; }

  .hist { background: rgba(195,216,166,.28); border: 2px solid rgba(53,80,46,.4); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 13.5px; color: var(--ink); padding-bottom: 5px; border-bottom: 2px solid rgba(53,80,46,.2); }
  .hist-head .pixelfont { font-size: 17px; color: var(--ink2); }
  .hist-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(53,80,46,.12); }
  .hist-row:last-child { border-bottom: none; }
  .dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .dot.ok { background: var(--ink); }
  .dot.skip { background: var(--ink2); }
  .hist-row .time { font-size: 19px; color: var(--ink); min-width: 52px; }
  .hist-row .mini-label { flex: 1; }
  .hist-row .xp { font-size: 17px; color: var(--ink); }
  .hist-row.muted { opacity: .55; }
  .hist-day-label { font-size: 12.5px; font-weight: 800; color: var(--ink2); letter-spacing: 1px; padding-top: 7px; }

const xpNeed = L => 80 + 30 * L;                      // Lv.4→5 cần 200 XP
const powerCap = L => Math.min(100, 40 + 6 * L);      // Lv.4 cap 64

/* ---------- registry điều kiện (spec §1.3) ---------- */
const COND = {
  level_at_least:          (st, v) => st.level  >= v,
  power_at_least:          (st, v) => st.power  >= v,
  streak_at_least:         (st, v) => st.streak >= v,
  healthy_days_at_least:   (st, v) => st.healthyDays >= v,
  sessions_today_at_least: (st, v) => st.todaySessions >= v,
  and: (st, of) => of.every(c => evalCond(st, c)),
  or:  (st, of) => of.some(c => evalCond(st, c)),
};
function evalCond(st, c) {
  if (c.k === 'and') return c.of.every(x => evalCond(st, x));
  if (c.k === 'or')  return c.of.some(x => evalCond(st, x));
  return COND[c.k](st, c.v);
}
const COND_CODE = {
  level_at_least: 'level', power_at_least: 'power', streak_at_least: 'streak',
  healthy_days_at_least: 'healthyDays', sessions_today_at_least: 'sessionsToday',
};
const COND_NAME = {
  level_at_least: 'LEVEL', power_at_least: 'SỨC MẠNH', streak_at_least: 'STREAK',
  healthy_days_at_least: 'KHỎE LIÊN TỤC', sessions_today_at_least: 'PHIÊN HÔM NAY',
};
function condText(c) {
  if (!c) return '—';
  if (c.k === 'and') return c.of.map(condText).join(' ∧ ');
  if (c.k === 'or')  return c.of.map(condText).join(' ∨ ');
  return COND_CODE[c.k] + '≥' + c.v;
}
function condLeaves(c, acc = []) {
  if (c.k === 'and' || c.k === 'or') c.of.forEach(x => condLeaves(x, acc));
  else acc.push(c);
  return acc;
}

/* silhouette dex: một màu tối trên nền màn sáng */
const SIL_COLOR = '#41523A';
function silPal(pal) { const out = {}; Object.keys(pal).forEach(k => { out[k] = SIL_COLOR; }); return out; }

/* palette ốm fallback: nhợt/desaturate (form có grid ốm riêng thì dùng grid riêng — spec §2.4) */
function desatPal(pal) {
  const out = {};
  Object.keys(pal).forEach(k => {
    const hex = pal[k];
    if (hex[0] !== '#' || hex.length !== 7) { out[k] = hex; return; }
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lum = (0.3 * r + 0.59 * g + 0.11 * b) / 255;
    const mix = ch => Math.round(ch * 0.22 + lum * 232 * 0.78);
    out[k] = 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
  });
  return out;
}

/* px theo hộp chứa (grid 32/40/48 dùng chung renderer) */
function fitPx(rows, box) {
  const h = rows.length, w = Math.max.apply(null, rows.map(r => r.length));
  return Math.max(1, Math.floor((box / Math.max(h, w)) * 2) / 2);
}

/* grid ốm RIÊNG theo form id — override data, bật khi condition < 30 (spec §2.4) */
const SICK_OF = { 'tan-lua': SPR_GRIDS.tanLuaOm, 'hoi-nuoc-boc': SPR_GRIDS.hoiNuocBocOm };
function formSprite(form, linePal, sick) {
  if (sick) {
    const g = SICK_OF[form.id] || (form.sickRows ? { rows: form.sickRows, pal: form.sickPal } : null);
    if (g) return g;
    return { rows: form.rows, pal: desatPal(form.pal || linePal) };
  }
  return { rows: form.rows, pal: form.pal || linePal };
}

/* ---------- pixel sprite renderer ---------- */
function PixelSprite({ rows, pal, px = 4, style, className }) {
  const h = rows.length;
  const w = Math.max.apply(null, rows.map(r => r.length));
  const rects = [];
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const c = pal[row[x]];
      if (c) rects.push(<rect key={x + '_' + y} x={x} y={y} width={1.04} height={1.04} fill={c} />);
    }
  });
  return (
    <svg width={w * px} height={h * px} viewBox={'0 0 ' + w + ' ' + h} shapeRendering="crispEdges" style={{ display: 'block', ...style }} className={className}>
      {rects}
    </svg>
  );
}

function CondBar({ name, need, cur }) {
  const ok = cur >= need;
  const blocks = 10;
  const on = Math.min(blocks, Math.round((cur / need) * blocks));
  const cells = [];
  for (let i = 0; i < blocks; i++) {
    cells.push(<i key={i} className={i < on ? (ok ? 'done' : 'on') : ''} />);
  }
  return (
    <div className="cond-bar">
      <span className="mini-label">{name} ≥ {need}</span>
      <div className="cond-cells">{cells}</div>
      <span className="pixelfont" style={ok ? { color: '#2E7D32' } : null}>{cur}/{need}{ok ? ' ✓' : ''}</span>
    </div>
  );
}

/* ---------- HUD battle kiểu Gen-1, MÀU Pokemon (spec §2.5) ----------
   Tên đậm + Lv · hàng TT (Thể trạng) + thanh vạch phân đoạn + số.
   Màu HP: xanh ≥50% → vàng 20–49% → đỏ <20%; <30 (ốm) = đỏ nhấp nháy. */
function BattleHUD({ name, level, cond, max = 100, compact }) {
  const critical = cond < 30;
  const pct = cond / max;
  const hpColor = pct >= 0.5 ? 'var(--hp-hi)' : pct >= 0.2 ? 'var(--hp-mid)' : 'var(--hp-low)';
  const cells = compact ? 14 : 22;
  const on = Math.max(0, Math.min(cells, Math.round((cond / max) * cells)));
  const segs = [];
  for (let i = 0; i < cells; i++) segs.push(<i key={i} className={i < on ? 'on' : ''} style={i < on ? { background: hpColor } : null} />);
  return (
    <div className={'gb-hud' + (compact ? ' compact' : '') + (critical ? ' crit' : '')}>
      <div className="gb-hud-top">
        <span className="gb-hud-name">{name}</span>
        <span className="gb-hud-lv">Lv.{level}</span>
      </div>
      <div className="gb-hud-hp">
        <span className="gb-hud-tt">TT</span>
        <span className="gb-hud-bar">{segs}</span>
        <span className="gb-hud-num">{cond}/{max}</span>
      </div>
    </div>
  );
}

/* helper: form hiện tại của pet theo level */
function heroForm(s) {
  const line = CATALOG[s.egg];
  let cur = line.stages[0];
  line.stages.forEach(st => { if (s.level >= st.atLevel) cur = st; });
  return { line, form: cur };
}
function condStateOf(s, simBoost) {
  return {
    level: s.level,
    power: simBoost ? Math.max(s.power, 85) : s.power,
    streak: simBoost ? Math.max(s.streak, 10) : s.streak,
    healthyDays: s.healthyDays,
    todaySessions: s.todaySessions,
  };
}

/* ============================ PHONE ============================ */

function PhoneApp({ tint, initial }) {
  const [s, setS] = useState(initial);
  const patch = o => setS(p => ({ ...p, ...o }));
  const { line, form } = heroForm(s);

  const goTab = id => patch({ tab: id, justFed: id === 'feed' ? s.justFed : false });
  const cycleTab = dir => {
    const idx = TAB_CYCLE.indexOf(s.tab);
    goTab(TAB_CYCLE[(idx + dir + TAB_CYCLE.length) % TAB_CYCLE.length]);
  };
  const moveLean = dir => {
    const opts = leanOptions(line.id);
    const idx = Math.max(0, opts.findIndex(o => o.key === s.lean));
    patch({ lean: opts[(idx + dir + opts.length) % opts.length].key });
  };
  const feed = () => {
    if (s.coins > 0) patch({ coins: s.coins - 1, condition: Math.min(100, s.condition + 15), xp: s.xp + 5, justFed: true });
  };
  const feedFromB = () => {
    if (s.tab === 'breed') { patch({ sick: true, power: 14, condition: 18 }); return; }
    if (s.coins > 0) patch({ tab: 'feed', coins: s.coins - 1, condition: Math.min(100, s.condition + 15), xp: s.xp + 5, justFed: true });
  };
  const simBreed = () => {
    if (s.flashing || s.revealed) return;
    patch({ flashing: true });
    setTimeout(() => setS(p => ({ ...p, flashing: false, simBoost: true, revealed: true })), 1050);
  };
  const sickSim = () => patch({ sick: true, power: 14, condition: 18 });
  const recover = () => patch({ sick: false, power: 62, condition: 78 });

  const onA = () => {
    if (s.tab === 'egg') { patch({ adopted: true }); return; }
    if (s.tab === 'focus') { patch({ run: !s.run }); return; }
    if (s.tab === 'breed') { simBreed(); return; }
    if (s.tab === 'feed') { feed(); return; }
  };
  const onDpad = dir => {
    if (s.tab === 'breed') moveLean(dir);
    else cycleTab(dir);
  };
  const onSelect = () => {
    if (s.tab === 'breed') moveLean(1);
    else patch({ run: !s.run });
  };

  const hint =
    s.tab === 'breed' ? '◀ ▶ đổi hướng mầm · A mô phỏng lai · B nghỉ 2 tuần · START về vòng tab' :
    s.tab === 'focus' ? '◀ ▶ đổi màn (▶ = LAB LAI TẠO) · A tạm dừng · B cho ăn' :
    s.tab === 'egg' ? 'A nhận trứng về nhà · ◀ ▶ đổi màn' :
    s.tab === 'feed' ? 'A/B cho ăn ngay · ◀ ▶ đổi màn' :
    'SELECT tạm dừng · START mở LAB LAI TẠO';

  const speaker = [];
  for (let i = 0; i < 6; i++) speaker.push(<i key={i} />);

  return (
    <div className="pshell" style={{ background: tint }}>
      <div className="shell-top">
        <div className="pwr"><span className="led" /><span className="psp">PWR</span></div>
        <div className="wordmark psp">PET POMODORO</div>
        <div className="model">PP-01</div>
      </div>
      <div className="bezel">
        <LcdPanel className="lcd-main">
          <div className="lcd-content">
            <div className="screen-scroll">
              {s.tab === 'egg' && <EggScreen s={s} patch={patch} />}
              {s.tab === 'focus' && <FocusScreen s={s} patch={patch} goBreed={() => patch({ tab: 'breed' })} />}
              {s.tab === 'breed' && <BreedScreen s={s} patch={patch} simBreed={simBreed} sickSim={sickSim} recover={recover} moveLean={moveLean} />}
              {s.tab === 'feed' && <FeedScreen s={s} patch={patch} feed={feed} />}
              {s.tab === 'stats' && <StatsScreen s={s} patch={patch} sickSim={sickSim} recover={recover} />}
            </div>
            <TabBar tab={s.tab} onTab={goTab} />
          </div>
        </LcdPanel>
        <div className="pixelfont bezel-cap">DOT-MATRIX · PIN CỦA BÉ = SỰ TẬP TRUNG</div>
      </div>
      <div className="deck">
        <Dpad onPrev={() => onDpad(-1)} onNext={() => onDpad(1)} />
        <div className="deck-mid">
          <div className="pills">
            <div className="pill-col"><button className="pill" aria-label="SELECT" onClick={onSelect} /><span className="shell-label">SELECT</span></div>
            <div className="pill-col"><button className="pill" aria-label="START" onClick={() => patch({ tab: 'breed' })} /><span className="shell-label">START</span></div>
          </div>
          <div className="speaker">{speaker}</div>
          <div className="deck-hint">{hint}</div>
        </div>
        <div className="deck-right">
          <RoundBtn letter="B" label="CHO ĂN" onClick={feedFromB} dark />
          <RoundBtn letter="A" label="OK" onClick={onA} />
        </div>
      </div>
    </div>
  );
}

function ConsolePhone({ tint, label, initial }) {
  return (
    <div className="demo-item">
      <em className="demo-label">{label}</em>
      <AndroidFrame time="20:24" battery={76}>
        <PhoneApp tint={tint} initial={initial} />
      </AndroidFrame>
    </div>
  );
}

/* ============================ POKÉDEX (DESKTOP) ============================ */

const CUR_BY_KEY = {
  level_at_least: HERO_CORE.level,
  power_at_least: HERO_CORE.power,
  streak_at_least: HERO_CORE.streak,
  healthy_days_at_least: HERO_CORE.healthyDays,
  sessions_today_at_least: HERO_CORE.todaySessions,
};

function DexCell({ e, unlocked, sel, onSelect }) {
  return (
    <button className={'dex-cell' + (sel ? ' sel' : '')} onClick={onSelect}>
      {e.kind === 'hybrid' && <span className="mini-tag">HIẾM</span>}
      {e.kind === 'branch' && <span className="mini-tag br">NHÁNH</span>}
      <span className="no">#{e.no}</span>
      <PixelSprite rows={e.rows} pal={unlocked ? e.pal : silPal(e.pal)} px={fitPx(e.rows, 50)} style={{ margin: '1px auto' }} />
      <span className="nm">{unlocked ? e.name : '???'}</span>
    </button>
  );
}

function DexDetail({ e, unlocked, onUnlock }) {
  const line = e.lineId ? CATALOG[e.lineId] : null;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
        <div className="side-sprite">
          <PixelSprite rows={e.rows} pal={unlocked ? e.pal : silPal(e.pal)} px={fitPx(e.rows, 96)} />
        </div>
        <div style={{ minWidth: 0 }}>
          <div className="side-name">{unlocked ? e.name : '???'}</div>
          <div className="mini-label" style={{ marginTop: 3 }}>
            {line ? line.icon + ' LINE ' + line.name.toUpperCase() : '★ MỞ ĐẦU'} · #{e.no}
          </div>
          <div style={{ display: 'flex', gap: 5, marginTop: 5, flexWrap: 'wrap' }}>
            <span className={'status-chip ' + (unlocked ? 'rest' : 'idle')}>{unlocked ? 'ĐÃ PHÁT HIỆN' : 'CHƯA GHI NHẬN'}</span>
            {e.kind === 'hybrid' && <span className="tag-rare">HIẾM</span>}
            {e.kind === 'branch' && <span className="tag-branch">NHÁNH</span>}
          </div>
        </div>
      </div>
      <div className="mini-label">VAI TRÒ: <span style={{ color: 'var(--ink)' }}>{e.role.toUpperCase()}</span></div>
      <div>
        <div className="sec-label" style={{ marginTop: 0 }}>ĐIỀU KIỆN MỞ (REGISTRY)</div>
        {e.cond ? (
          <React.Fragment>
            <span className="cond-code">{condText(e.cond)}</span>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginTop: 7 }}>
              {condLeaves(e.cond).map((leaf, i) => (
                <CondBar key={i} name={COND_NAME[leaf.k]} need={leaf.v} cur={CUR_BY_KEY[leaf.k]} />
              ))}
            </div>
          </React.Fragment>
        ) : (
          <span className="lean-sub">Không điều kiện — {e.kind === 'egg' ? 'nhận 1/3 trứng ở màn Trứng.' : 'tiến hoá theo mốc level từ CATALOG.'}</span>
        )}
      </div>
      <button className="phys-btn red" disabled={unlocked} onClick={onUnlock}>
        {unlocked ? 'ĐÃ PHÁT HIỆN ✓' : 'Mô phỏng mở khóa'}
      </button>
    </div>
  );
}

function PokedexApp() {
  const [dex, setDex] = useState({ unlocked: ['egg', 'tan-lua', 'bong-bot'], selId: 'tan-lua' });
  const sel = DEX_ENTRIES.find(e => e.id === dex.selId);
  const isUnlocked = id => dex.unlocked.indexOf(id) !== -1;
  const unlock = () => {
    if (!isUnlocked(sel.id)) setDex({ ...dex, unlocked: [...dex.unlocked, sel.id] });
  };
  const sections = [
    { key: 'egg', label: '★ TRỨNG NGUYÊN TỐ', items: DEX_ENTRIES.filter(e => e.kind === 'egg') },
  ].concat(Object.values(CATALOG).map(line => ({
    key: line.id,
    label: line.icon + ' LINE ' + line.name.toUpperCase() + ' — 3 STAGE + 2 NHÁNH + 1 LAI',
    items: DEX_ENTRIES.filter(e => e.lineId === line.id),
  })));
  const count = dex.unlocked.length;
  const total = DEX_ENTRIES.length;
  const blocks = [];
  for (let i = 0; i < total; i++) blocks.push(<i key={i} className={i < count ? 'on' : ''} />);

  return (
    <div className="web-app">
      <header className="web-bar">
        <span className="psp web-mark">PET POMODORO</span>
        <nav className="web-nav">
          <span className="wnav active">Pokédex</span>
          <span className="wnav">Thống kê</span>
          <span className="wnav">Cửa hàng</span>
        </nav>
        <div className="web-right">
          <CoinChip coin={12} />
          <div className="avatar sm">
            <PixelSprite rows={AVATAR_ROWS} pal={AVATAR_PAL} px={2.6} />
          </div>
        </div>
      </header>
      <div className="web-main">
        <section className="web-left">
          <LcdPanel className="lcd-web">
            <div className="w-content">
              <div className="dex-head">
                <div>
                  <div className="psp" style={{ fontSize: 15, color: 'var(--ink)' }}>POKÉDEX</div>
                  <div className="dex-legend">
                    {total} form · 3 line nguyên tố
                    <span className="sw" style={{ background: '#45B54E' }} />đã phát hiện
                    <span className="sw" style={{ background: SIL_COLOR }} />chưa gặp (silhouette)
                  </div>
                </div>
                <div className="dex-count">
                  <span className="pixelfont" style={{ whiteSpace: 'nowrap' }}>{count}/{total} ĐÃ PHÁT HIỆN</span>
                  <div className="dex-blocks">{blocks}</div>
                </div>
              </div>
              <div className="dex-grid">
                {sections.map(sec => (
                  <React.Fragment key={sec.key}>
                    <div className="dex-line-head"><span>{sec.label}</span><span className="rule" /></div>
                    {sec.items.map(e => (
                      <DexCell key={e.id} e={e} unlocked={isUnlocked(e.id)} sel={e.id === dex.selId}
                        onSelect={() => setDex({ ...dex, selId: e.id })} />
                    ))}
                  </React.Fragment>
                ))}
              </div>
            </div>
          </LcdPanel>
        </section>
        <section className="web-right-col">
          <div className="plastic-card">
            <div className="mc-head mini-label" style={{ marginBottom: 8 }}>CHI TIẾT FORM · ĐIỀU KIỆN ĐỌC TỪ REGISTRY</div>
            <DexDetail e={sel} unlocked={isUnlocked(sel.id)} onUnlock={unlock} />
          </div>
          <div className="plastic-card">
            <div className="mc-head mini-label" style={{ marginBottom: 4 }}>KIẾN TRÚC MỞ (SPEC §1) · UI ĐỌC TỪ SYSTEMS</div>
            {SYSTEMS.map(sys => (
              <div className="sys-row" key={sys.id}>
                <span className="psp">{sys.id.toUpperCase()}</span>
                <span className="sys-desc">
                  on: {sys.on ? Object.keys(sys.on).join(', ') : '—'}
                  {sys.decay ? ' · decay: ' + Object.keys(sys.decay).map(k => sys.decay[k] + ' (' + k + ')').join(', ') : ''}
                  {' · ui: ' + (sys.ui || []).map(u => u.slot + '/' + u.type).join(', ')}
                </span>
              </div>
            ))}
            <div className="dev-chips" style={{ marginTop: 8 }}>
              <span className="dev-chip">CATALOG · 19 FORM</span>
              <span className="dev-chip">COND · 7 KEYS</span>
              <span className="dev-chip ok">THÊM HỆ = THÊM 1 ENTRY</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  );
}
