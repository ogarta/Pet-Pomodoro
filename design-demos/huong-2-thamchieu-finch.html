/* ---------- Sprite renderer (CSS grid, palette swap) ---------- */
function PixelSprite({ art, palette, px = 6, patches = [], style }) {
  const grid = art.map(r => r.split(''));
  patches.forEach(([r, c, ch]) => { if (grid[r] && c < grid[r].length) grid[r][c] = ch; });
  const w = art[0].length;
  const cells = [];
  grid.forEach((row, y) => row.forEach((ch, x) => {
    cells.push(<div key={x + '_' + y} style={{ width: px, height: px, background: ch === '.' ? 'transparent' : (palette[ch] || 'transparent') }} />);
  }));
  return (
    <div style={{ display: 'grid', gridTemplateColumns: `repeat(${w}, ${px}px)`, gridTemplateRows: `repeat(${grid.length}, ${px}px)`, lineHeight: 0, ...style }}>
      {cells}
    </div>
  );
}

function Pet({ species, state = 'idle', px = 7, className = '' }) {
  const pal = SPECIES[species] || SPECIES.cat;
  const patches = PET_PATCHES[state] || [];
  return (
    <PixelSprite art={PET_ART} palette={pal} px={px} patches={patches}
      style={{ filter: 'drop-shadow(0 6px 0 rgba(67,56,46,0.10))' }}
      className={className} />
  );
}

  );
}

/* ----- Mini state machine cho mỗi phone ----- */
function PhoneApp({ initialTab = 'egg', initialMode = 'focus', initialAdopted }) {
  const [tab, setTab] = useState(initialTab);
  const [species, setSpecies] = useState('cat');
  const [petName, setPetName] = useState('Mochi');
  const [selectedEgg, setSelectedEgg] = useState(null);
  const [adopted, setAdopted] = useState(initialAdopted !== undefined ? initialAdopted : initialTab !== 'egg');
  const [eggMsg, setEggMsg] = useState(null);
  const [coins, setCoins] = useState(12);
  const [fedTimes, setFedTimes] = useState(0);
  const [hunger, setHunger] = useState(34);
  const [joy, setJoy] = useState(62);
  const [feedMsg, setFeedMsg] = useState(null);
  const [mode, setMode] = useState(initialMode); // focus | paused | break | ready
  const [session, setSession] = useState(2);

  const app = {
    tab, species, petName, selectedEgg, adopted, eggMsg, coins, fedTimes, hunger, joy, feedMsg, mode, session,
    selectEgg: (id) => {
      setSelectedEgg(id);
      setEggMsg(null);
    },
    adopt: () => {
      const egg = EGGS.find(e => e.id === selectedEgg);
      if (!egg || adopted) return;
      setSpecies(egg.species);
      setPetName(egg.name);
      setAdopted(true);
      setEggMsg(`Đã đón ${egg.name} về nhà! Chúc hai bạn tập trung vui nhé.`);
    },
    togglePause: () => setMode(m => m === 'paused' ? 'focus' : 'paused'),
    abortSession: () => { setMode('ready'); setSession(s => Math.min(s + 1, 4)); },
    skipBreak: () => { setMode('ready'); setSession(s => Math.min(s + 1, 4)); },
    startSession: () => setMode('focus'),
    feed: () => {
      if (coins <= 0) return;
      setCoins(c => c - 1);
      setFedTimes(n => n + 1);
      setHunger(h => Math.min(h + 38, 100));
      setJoy(j => Math.min(j + 23, 100));
      setFeedMsg(`${petName} thích lắm! Đói +38 · Vui +23`);
    },
  };

  const screen =
    tab === 'egg' ? <EggScreen app={app} />
    : tab === 'focus' ? <FocusScreen app={app} />
    : tab === 'feed' ? <FeedScreen app={app} />
    : <StatsScreen app={app} />;

  return (
    <div style={{ height: '100%', background: C.cream, display: 'flex', flexDirection: 'column', fontFamily: F.body, userSelect: 'none' }}>
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 16px 18px' }}>
        {screen}
      </div>
