/* ============================================================
   Pet Pomodoro — KỊCH BẢN 2 · HUẤN LUYỆN VIÊN (gameplay v2)
   Style Finch: pastel kem–mint · card trắng bo tròn 22 · nút pill
   Điểm nhấn: Sức mạnh là trung tâm + Ốm yếu chặn cổng tiến hoá.
   ============================================================ */

const C = {
  cream:'#FBF3E4', card:'#FFFFFF', ink:'#43382E', sub:'#6E6257',
  mint:'#C8EBDC', mintDeep:'#0D5C49', mintBar:'#5FC4A2',

/* ============================================================
   §1 KIẾN TRÚC MỞ — bằng chứng sống (spec §1)
   core chỉ có event bus; mọi hệ là 1 entry trong SYSTEMS.
   ============================================================ */

// Công thức chung (spec §3)
const capOf = (L) => Math.min(100, 40 + 6 * L);   // cap Sức mạnh theo level → Lv.4 = 64
const need = (L) => 80 + 30 * L;                  // XP lên mức → Lv.4→5 cần 200

// §1.1 Core tối thiểu — fixture dùng chung mọi demo (spec §3)
const FIXTURE = {
  speciesId: 'flame', stageIndex: 0,
  level: 4, xp: 120,            // Lv.4 · 120/200 XP
  power: 62, condition: 78,     // Sức mạnh 62/64 · Thể trạng 78 (Khỏe mạnh)
  coins: 12, streak: 7,         // 12 sushi · Streak 7 ngày
  todaySessions: 3, todayMinutes: 112,
  healthyDays: 1,               // chuỗi ngày khỏe mạnh (cổng tiến hoá cần 3)
};

// §1.3 Registry điều kiện (dùng chung, combo AND/OR) — thêm loại mới = đăng ký 1 key
const COND = {
  level_at_least:          (s, v) => s.level       >= v,
  power_at_least:          (s, v) => s.power       >= v,
  streak_at_least:         (s, v) => s.streak      >= v,
  healthy_days_at_least:   (s, v) => s.healthyDays >= v,
  sessions_today_at_least: (s, v) => s.todaySessions >= v,
  and: (s, of) => of.every((c) => evalCond(s, c)),
  or:  (s, of) => of.some((c) => evalCond(s, c)),
};
const CUR = {
  level_at_least: (s) => s.level, power_at_least: (s) => s.power,
  streak_at_least: (s) => s.streak, healthy_days_at_least: (s) => s.healthyDays,
  sessions_today_at_least: (s) => s.todaySessions,
};
const COND_LABEL = {
  level_at_least: (v) => `Lv.${v}`,
  power_at_least: (v) => `Sức mạnh ≥ ${v}`,
  streak_at_least: (v) => `Streak ≥ ${v}`,
  healthy_days_at_least: (v) => `Khỏe mạnh ${v} ngày liên tục`,
  sessions_today_at_least: (v) => `≥ ${v} phiên hôm nay`,
};
function evalCond(s, c) { return COND[c.key](s, c.value); }
function evalGate(s, gate) { return COND[gate.op](s, gate.of); }
function condText(c) { return COND_LABEL[c.key](c.value); }

// §1.2 Module hệ — mỗi hệ = 1 khai báo; UI đọc SYSTEMS[].ui để biết vẽ gì ở slot nào
const SYSTEMS = [
  { id: 'level', name: 'Level & XP',
    on: {
      session_complete: (c, m) => ({ xp: c.xp + m, coins: c.coins + 1 }),
      feed: (c) => ({ xp: c.xp + 5, coins: c.coins - 1 }),
    },
    emits: ['level_up'], ui: [] },
  { id: 'power', name: 'Sức mạnh',
    on: { session_complete: (c) => ({ power: Math.min(capOf(c.level), c.power + 8) }) },
    decay: { perIdleDay: -6, perGoalDay: -2 },
    ui: [{ slot: 'focus', type: 'meter', label: 'Sức mạnh' }] },
  { id: 'condition', name: 'Thể trạng',
    on: { feed: (c) => ({ condition: Math.min(100, c.condition + 15) }) },
    decay: { perIdleDay: -10 },
    ui: [{ slot: 'focus', type: 'meter', label: 'Thể trạng' }, { slot: 'care', type: 'health_status' }] },
  { id: 'evolution', name: 'Tiến hoá',
    on: { level_up: 'checkEvolution' },
    rules: ['stage gate (registry)', 'branch Stage 3', 'form lai'],
    ui: [{ slot: 'stats', type: 'evo_gate' }] },
  { id: 'collection', name: 'Sưu tầm',
    ui: [{ slot: 'desktop', type: 'pokedex' }] },
];

// Event bus tối thiểu: dispatcher gọi mọi hệ lắng nghe sự kiện, gom patch lại.
function dispatch(core, event, payload = 25) {
  let s = { ...core };
  if (event === 'session_complete') {
    s.todaySessions = s.todaySessions + 1;
    s.todayMinutes = s.todayMinutes + payload;
  }
  SYSTEMS.forEach((sys) => {
    const h = sys.on && sys.on[event];
    if (typeof h === 'function') s = { ...s, ...h(s, payload) };
  });
  while (s.xp >= need(s.level)) {
    // hệ level phát 'level_up' → hệ evolution nghe được (checkEvolution):
    // trong game thật, đủ gate stage kế tiếp sẽ tự tiến hoá ngay tại đây.
    s = { ...s, xp: s.xp - need(s.level), level: s.level + 1 };
  }
  return s;
}

/* ============================================================
   Pixel art renderer — CSS grid of divs + patch dữ liệu
   ============================================================ */
function PixelSprite({ art, palette, px = 6, patches = [], shiftDown = 0, style }) {
  let grid = art.map((r) => r.split(''));
  if (shiftDown > 0) {
    const empty = new Array(grid[0].length).fill('.');
    const kept = grid.slice(0, grid.length - shiftDown);
    const pad = [];
    for (let i = 0; i < shiftDown; i++) pad.push([...empty]);
    grid = pad.concat(kept);
  }
  patches.forEach(([r, c, ch]) => { if (grid[r] && c < grid[r].length) grid[r][c] = ch; });
  const w = grid[0].length;
  const cells = [];
  grid.forEach((row, y) => row.forEach((ch, x) => {
    cells.push(<div key={x + '_' + y} style={{ width: px, height: px, background: ch === '.' ? 'transparent' : (palette[ch] || 'transparent') }} />);
  }));
  return (
    <div style={{ display: 'grid', gridTemplateColumns: `repeat(${w}, ${px}px)`, gridTemplateRows: `repeat(${grid.length}, ${px}px)`, lineHeight: 0, ...style }}>
      {cells}
    </div>
  );
}

function stageOf(speciesId, stageIndex) {
  const sp = CATALOG[speciesId] || CATALOG.flame;
  return sp.stages[Math.min(stageIndex, sp.stages.length - 1)];
}

function StageSprite({ speciesId = 'flame', stageIndex = 0, sick = false, px = 7, style }) {
  const sp = CATALOG[speciesId] || CATALOG.flame;
  const stage = stageOf(speciesId, stageIndex);
  const art = stage.art || sp.stages[0].art;
  // §2.4: form có grid ốm RIÊNG (silhouette vẽ lại từ đầu) → dùng grid đó
  // + palette nhợt SICK_PAL, không qua patch. Form khác chưa có grid →
  // fallback generic: patch mắt nhắm + desaturate.
  if (sick && SICK_ART[stage.id]) {
    return <PixelSprite art={SICK_ART[stage.id]} palette={SICK_PAL} px={px} style={style} />;
  }
  const pal = SPECIES_PAL[speciesId] || SPECIES_PAL.flame;   // màu v3 theo line (spec §2.5)
  const patches = sick ? (SICK_EYES[stage.id] || []) : [];
  return (
    <PixelSprite art={art} palette={pal} px={px} patches={patches} shiftDown={sick ? 1 : 0}
      style={{ ...(sick ? { filter: 'saturate(0.45) brightness(1.05)' } : {}), ...style }} />
  );
}

// Form chưa mở → silhouette một màu ink ấm (chất Pokédex, spec §2.5)
function Silhouette({ speciesId, stageIndex = 0, px = 4 }) {
  const sp = CATALOG[speciesId] || CATALOG.flame;
  const stage = stageOf(speciesId, stageIndex);
  const art = stage.art || sp.stages[0].art;
  const pal = {};
  Object.keys(SPECIES_PAL[speciesId] || SPECIES_PAL.flame).forEach((ch) => { pal[ch] = '#4A3F35'; });
  return <PixelSprite art={art} palette={pal} px={px} />;
}

function Chip({ bg, fg, children, style }) {

function Meter({ label, value, max = 100, barColor, textColor, chip }) {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 13, fontWeight: 800, marginBottom: 5 }}>
        <span style={{ color: C.sub }}>{label}</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          {chip && <Chip bg={chip.bg} fg={chip.fg}>{chip.label}</Chip>}
          <span style={{ color: textColor }}>{value}/{max}</span>
        </span>
      </div>
      <div style={{ height: 10, background: C.track, borderRadius: 999, overflow: 'hidden' }}>
        <div style={{ width: `${pct}%`, height: '100%', background: barColor, borderRadius: 999, transition: 'width .5s ease' }} />
      </div>
    </div>
  );
}

// Meter Sức mạnh có VẠCH CAP theo level — cap(L) = min(100, 40 + 6×L)
function PowerMeter({ power, cap, level }) {
  return (
    <div style={{ paddingTop: 14 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, fontWeight: 800, marginBottom: 5 }}>
        <span style={{ color: C.sub }}>Sức mạnh</span>
        <span style={{ color: C.peachDeep }}>{power}/{cap} · vạch cap Lv.{level}</span>
      </div>
      <div style={{ position: 'relative', height: 12, background: C.track, borderRadius: 999 }}>
        <div style={{ width: `${power}%`, height: '100%', background: C.peachBar, borderRadius: 999, transition: 'width .5s ease' }} />
        <div style={{ position: 'absolute', left: `${cap}%`, top: -3, bottom: -3, width: 2.5, background: C.ink, borderRadius: 2, opacity: 0.65 }} />
        <div style={{ position: 'absolute', left: Math.min(cap + 1, 74) + '%', top: -15, fontSize: 10.5, fontWeight: 800, color: C.sub, whiteSpace: 'nowrap' }}>
          cap = min(100, 40 + 6·Lv) = {cap}
        </div>
      </div>
    </div>

}

function condStatus(v) {
  if (v >= 70) return { name: 'Khỏe mạnh',   bg: C.mint,   fg: C.mintDeep,   bar: C.mintBar };
  if (v >= 30) return { name: 'Bình thường', bg: C.butter, fg: C.butterDeep, bar: C.butterBar };
  return { name: 'Ốm yếu', bg: C.danger, fg: C.dangerDeep, bar: C.dangerBar };
}

/* ---------- HUD battle kiểu Gen-1 (theo ảnh mẫu Pokémon Red):
   dòng tên đậm + Lv nhỏ, hàng TT + thanh vạch + số. Thanh HP MÀU KIỂU
   POKEMON (spec §2.5): xanh lá ≥50% · vàng 20–49% · đỏ <20%,
   nhấp nháy đỏ khi ốm (khớp sprite ốm). ---------- */
function BattleHUD({ petName, level, condition, sick = false, style }) {
  const SEGS = 10;
  const filled = Math.max(sick ? 1 : 0, Math.round((condition / 100) * SEGS));
  const hpColor = sick || condition < 20 ? '#E5484D' : condition >= 50 ? '#3FA383' : '#E8B93B';
  return (
    <div style={{
      display: 'inline-block', background: '#FFFDF6',
      border: '2px solid #43382E', borderRadius: 10,
      boxShadow: 'inset 0 0 0 1.5px #FBF3E4, 0 6px 14px rgba(67,56,46,0.14)',
      padding: '6px 10px 7px', fontFamily: MONO, color: '#43382E', ...style,
    }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, lineHeight: 1 }}>
        <span style={{ fontSize: 12.5, fontWeight: 800, letterSpacing: 0.5 }}>{String(petName || '').toUpperCase()}</span>
        <span style={{ fontSize: 10, fontWeight: 800 }}>Lv.{level}</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginTop: 5, lineHeight: 1 }}>
        <span style={{ fontSize: 9.5, fontWeight: 800 }}>TT</span>
        <span className={sick ? 'pp-pulse' : ''} style={{ display: 'inline-flex', gap: 1.5 }}>
          {Array.from({ length: SEGS }).map((_, i) => (
            <span key={i} style={{
              width: 7, height: 9,
              background: i < filled ? hpColor : 'rgba(67,56,46,0.13)',
            }} />
          ))}
        </span>
        <span style={{ fontSize: 10.5, fontWeight: 800 }}>{condition}/100</span>
      </div>
    </div>
  );
}

/* ============================================================
   Registry renderer — hàng điều kiện + thẻ CỬA TIẾN HOÁ
   (checklist & verdict đọc 100% từ CATALOG + COND)
   ============================================================ */
function CondRow({ cond, core }) {
  const ok = evalCond(core, cond);
  const cur = Math.min(CUR[cond.key](core), cond.value);
  const shown = CUR[cond.key](core);
  const pct = Math.max(0, Math.min(100, (shown / cond.value) * 100));
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      <div style={{ width: 22, height: 22, borderRadius: '50%', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 800, background: ok ? C.mintDeep : C.track, color: ok ? '#fff' : C.sub }}>
        {ok ? '✓' : '·'}
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13.5, fontWeight: 800 }}>
          <span style={{ color: C.ink }}>{condText(cond)}</span>
          <span style={{ color: ok ? C.mintDeep : C.sub }}>{shown}/{cond.value}{cond.key === 'level_at_least' ? '' : ''}</span>
        </div>
        <div style={{ height: 6, background: C.track, borderRadius: 999, marginTop: 4, overflow: 'hidden' }}>
          <div style={{ width: `${pct}%`, height: '100%', background: ok ? C.mintBar : C.peachBar, borderRadius: 999, transition: 'width .4s ease' }} />
        </div>
        {cond.key === 'level_at_least' && <div style={{ fontSize: 11, fontWeight: 700, color: C.sub, marginTop: 2 }}>hiện tại Lv.{core.level} → cần Lv.{cond.value}</div>}
      </div>
    </div>
  );
}

function GateCard({ core, speciesId, stageIndex, evolving, onSimulate, onReset, readonly, slim }) {
  const sp = CATALOG[speciesId];
  const next = sp.stages[stageIndex + 1];
  const after = sp.stages[stageIndex + 2];
  const pass = next ? evalGate(core, next.gate) : false;
  return (
    <Card style={{ borderTop: `4px solid ${pass ? C.mintBar : C.dangerBar}`, display: 'flex', flexDirection: 'column', gap: 12 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 30, height: 30, borderRadius: 12, background: C.mint, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <PixelSprite art={FLAME_ART} palette={FLAME_PAL} px={2} />
          </div>
          <div style={{ fontFamily: F.display, fontWeight: 800, fontSize: 16.5, color: C.ink }}>Cửa tiến hoá</div>
        </div>
        <Chip bg={C.sky} fg={C.skyDeep}>Stage {stageIndex + 1} → {stageIndex + 2}</Chip>
      </div>

      {next && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, background: slim ? 'transparent' : C.cream, borderRadius: 18, padding: slim ? 0 : 10 }}>
          <div style={{ width: 66, height: 66, borderRadius: '50%', background: SPECIES_BG[speciesId] || SPECIES_BG.flame, border: '1.5px solid rgba(67,56,46,0.14)', boxShadow: 'inset 0 -6px 12px rgba(67,56,46,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' }}>
            <div className={evolving ? 'pp-flash' : ''}>
              <StageSprite speciesId={speciesId} stageIndex={stageIndex + 1} px={2.05} />
            </div>
          </div>
          <div>
            <div style={{ fontFamily: F.display, fontWeight: 800, fontSize: 15.5, color: C.ink }}>
              {sp.stages[stageIndex].name} → {next.name}
            </div>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: C.sub, marginTop: 1 }}>{next.note} · mở ở Lv.{next.atLevel}</div>
          </div>
        </div>
      )}

      {next && next.gate.of.map((c) => <CondRow key={c.key + c.value} cond={c} core={core} />)}

      {after && (
        <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 10 }}>
          <div style={{ fontSize: 12.5, fontWeight: 800, color: C.sub, marginBottom: 8 }}>Cửa sau · {after.name} (Stage 3 · Lv.{after.atLevel})</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {after.gate.of.map((c) => <CondRow key={'a' + c.key + c.value} cond={c} core={core} />)}
          </div>
        </div>
      )}

      {stageIndex === 0 && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: C.butter, border: '1px solid #F2DD9B', borderRadius: 14, padding: '8px 12px' }}>
          <span style={{ fontSize: 15 }}>🤒</span>
          <span style={{ fontSize: 12.5, fontWeight: 800, color: C.butterDeep }}>
            Ốm yếu làm chuỗi ngày khỏe ngắt — cổng 「Khỏe mạnh 3 ngày」 đóng lại. Chăm sóc trước, tiến hoá sau!
          </span>
        </div>
      )}

      {next && (
        <div style={{ textAlign: 'center', fontSize: 14, fontWeight: 800, borderRadius: 999, padding: '10px 14px', background: pass ? C.mint : C.danger, color: pass ? C.mintDeep : C.dangerDeep }}>
          {pass ? 'Đủ điều kiện tiến hoá! Bấm mô phỏng để lóe sáng…' : 'Chưa đủ điều kiện tiến hoá'}
        </div>
      )}

      {stageIndex === 1 && (
        <div style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ fontSize: 12.5, fontWeight: 800, color: C.sub }}>Nhánh Stage 3 — chọn 1 trong 2 (đọc từ registry)</div>
          {sp.branches.map((b) => {
            const ok = evalGate(core, b.cond);
            return (
              <div key={b.id} style={{ display: 'flex', alignItems: 'center', gap: 10, background: C.cream, borderRadius: 14, padding: '8px 12px' }}>
                <span style={{ fontSize: 15 }}>{ok ? '✅' : '🔒'}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 800, color: C.ink }}>{b.name}</div>
                  <div style={{ fontSize: 11.5, fontWeight: 700, color: C.sub }}>{b.note}</div>
                </div>
                <span style={{ fontSize: 11.5, fontWeight: 800, color: C.skyDeep, fontFamily: MONO }}>
                  {b.cond.of.map((c) => condText(c)).join(' ∧ ')}
                </span>
              </div>
            );
          })}
          {!readonly && (
            <div style={{ fontSize: 12, fontWeight: 700, color: C.sub }}>
              Kịch bản 2 dừng ở Stage 2 — nhánh & form lai xem Kịch bản 1 và 3.
            </div>
          )}
        </div>
      )}

      {!readonly && (
        <div style={{ display: 'flex', gap: 10 }}>
          {stageIndex === 0 ? (
            <PillButton tone="mint" onClick={onSimulate} disabled={evolving} style={{ flex: 1 }}>
              {evolving ? 'Đang tiến hoá…' : 'Mô phỏng tiến hoá'}
            </PillButton>
          ) : (
            <PillButton tone="white" disabled style={{ flex: 1 }}>Đã tiến hoá — KB2 dừng ở Stage 2</PillButton>
          )}
          <PillButton tone="white" onClick={onReset} style={{ width: 118, flexShrink: 0 }}>↺ Đặt lại</PillButton>
        </div>
      )}
    </Card>
  );
}

  const [selectedEgg, setSelectedEgg] = useState(null);
  const [adopted, setAdopted] = useState(initialTab !== 'egg');
  const [eggMsg, setEggMsg] = useState(null);
  const [paused, setPaused] = useState(false);
  const [done, setDone] = useState(2);
  const [fedTimes, setFedTimes] = useState(0);
  const [feedMsg, setFeedMsg] = useState(null);
  const [sick, setSick] = useState(false);
  const [recovery, setRecovery] = useState(0);
  const [recovered, setRecovered] = useState(false);
  const [evolving, setEvolving] = useState(false);
  const [evoMsg, setEvoMsg] = useState(null);

  const app = {
    tab, core, speciesId, stageIndex, petName, selectedEgg, adopted, eggMsg,
    paused, done, fedTimes, feedMsg, sick, recovery, recovered, evolving, evoMsg,
    selectEgg: (id) => { setSelectedEgg(id); setEggMsg(null); },
    adopt: () => {
      const egg = EGGS.find((e) => e.id === selectedEgg);
      if (!egg || adopted) return;
      setSpeciesId(egg.speciesId);
      setPetName(egg.starter);
      setAdopted(true);
      setEggMsg(`Đã đón ${egg.starter} về nhà! Cho ăn + tập trung để nâng Lv nhé.`);
    },
    togglePause: () => setPaused((p) => !p),
    completeSession: () => {
      setCore((c) => dispatch(c, 'session_complete', 25));
      setDone((d) => Math.min(4, d + 1));
    },
    feed: () => {
      if (core.coins <= 0) return;
      setCore((c) => dispatch(c, 'feed'));
      setFedTimes((n) => n + 1);
      setFeedMsg(`${petName} thích lắm! Thể trạng +15 · +5 XP`);
      if (sick) {
        const n = recovery + 1;
        setRecovery(n);
        if (n >= 3) {
          setSick(false);
          setRecovered(true);
          setCore((c) => ({ ...c, healthyDays: 3 }));
        }
      }
    },
    neglect: () => {
      setCore((c) => ({ ...c, condition: 28, power: Math.max(0, c.power - 30), healthyDays: 0 }));
      setSick(true);
      setRecovery(0);
      setRecovered(false);
      setFeedMsg(null);
    },
    resetCare: () => {
      setCore({ ...FIXTURE });
      setSick(false);
      setRecovery(0);
      setRecovered(false);
      setFedTimes(0);
      setFeedMsg(null);
    },
    simulateEvolution: () => {
      if (stageIndex !== 0 || evolving) return;
      // Đổ đủ điều kiện gate Stage 2 (registry): level ≥ 8 · khỏe mạnh ≥ 3 ngày · (power gate Stage 3 trông thấy)
      setCore((c) => ({ ...c, level: 8, xp: 40, healthyDays: 3, power: 70 }));
      setEvolving(true);
      setTimeout(() => {
        setStageIndex(1);
        setEvolving(false);
        setEvoMsg('Lóe sáng! Tàn Lửa đã tiến hoá thành Bồng Bột — mọc cánh mầm ✨');
      }, 950);
    },
    resetAll: () => {
      setCore({ ...FIXTURE });
      setStageIndex(0);
      setSick(false);
      setRecovery(0);
      setRecovered(false);
      setEvolving(false);
      setEvoMsg(null);
      setDone(2);
      setPaused(false);
    },
  };

  const screen =
    tab === 'egg' ? <EggScreen app={app} />
    : tab === 'focus' ? <FocusScreen app={app} />
    : tab === 'feed' ? <CareScreen app={app} />
    : <StatsScreen app={app} />;

  return (
    <div style={{ height: '100%', background: C.cream, display: 'flex', flexDirection: 'column', fontFamily: F.body, userSelect: 'none' }}>
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 16px 18px' }}>
        {screen}
      </div>
      <NavBar tab={tab} onTab={setTab} />
    </div>
  );
}
